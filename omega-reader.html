<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository — A Unit in Four Registers</title>
<style>
  :root {
    --bg: #fbfaf7; --ink: #1b1b1b; --muted: #6b6b6b; --rule: #d9d5cc;
    --accent: #7a3e1d; --panel: #f2efe8; --max: 46rem;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  [data-theme="dark"] {
    --bg: #141414; --ink: #e8e4dc; --muted: #9a958c; --rule: #2e2c28;
    --accent: #d99a6c; --panel: #1d1c1a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.65 Georgia, "Iowan Old Style", serif;
    transition: background .2s, color .2s;
  }
  #bar {
    position: sticky; top: 0; z-index: 10; display: flex; gap: .5rem;
    flex-wrap: wrap; row-gap: .35rem;
    align-items: center; padding: .55rem 1rem;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(6px); border-bottom: 1px solid var(--rule);
    font-family: system-ui, sans-serif; font-size: .82rem;
  }
  #bar a, #bar button {
    color: var(--muted); text-decoration: none; background: none;
    border: 1px solid transparent; border-radius: 6px;
    padding: .3rem .55rem; cursor: pointer; font: inherit;
  }
  #bar a:hover, #bar button:hover { color: var(--ink); border-color: var(--rule); }
  #bar .grow { flex: 1; }
  #bar .vol { border: 1px solid var(--rule); border-radius: 999px; padding: .28rem .7rem; }
  #bar .vol[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { max-width: var(--max); margin: 0 auto; padding: 3rem 1.4rem 8rem; }
  h1, h2, h3 { font-family: system-ui, sans-serif; line-height: 1.2; letter-spacing: -.015em; }
  h1 { font-size: 2rem; margin: 0 0 .4rem; }
  h2 { font-size: 1.35rem; margin: 2.4rem 0 .6rem; }
  h3 { font-size: 1.05rem; margin: 1.8rem 0 .4rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--accent); }
  kbd { font-family: var(--mono); font-size: .78rem; border: 1px solid var(--rule); border-radius: 4px; padding: 0 .3rem; }
  .kicker { font-family: system-ui, sans-serif; font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .lede { font-size: 1.12rem; color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  .bookmarks { display: grid; gap: 1rem; margin: 2.2rem 0; }
  @media (min-width: 640px) { .bookmarks { grid-template-columns: repeat(2, 1fr); } }
  .bookmark {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--panel); border: 1px solid var(--rule); border-radius: 10px;
    padding: 1.2rem 1.1rem; transition: transform .12s, border-color .12s;
  }
  .bookmark:hover { transform: translateY(-2px); border-color: var(--accent); }
  .bookmark .tag { font-family: var(--mono); font-size: .7rem; color: var(--accent); }
  .bookmark strong { display: block; font-family: system-ui, sans-serif; font-size: 1.05rem; margin: .35rem 0 .3rem; }
  .bookmark span { font-size: .9rem; color: var(--muted); }
  pre, code { font-family: var(--mono); font-size: .82rem; }
  pre {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 8px;
    padding: 1rem; overflow-x: auto; line-height: 1.5;
  }
  details.provenance {
    margin: 1rem 0; padding: .6rem .8rem;
    background: var(--panel); border: 1px solid var(--rule); border-radius: 6px;
    font-family: var(--mono); font-size: .78rem;
  }
  details.provenance summary {
    cursor: pointer; color: var(--accent); font-family: system-ui, sans-serif;
    font-size: .78rem; letter-spacing: .05em; text-transform: uppercase;
  }
  details.provenance pre { background: transparent; border: 0; padding: .5rem 0 0; margin: 0; }
  #toc {
    position: fixed; inset: 0 auto 0 0; width: min(20rem, 84vw); z-index: 20;
    background: var(--bg); border-right: 1px solid var(--rule);
    transform: translateX(-102%); transition: transform .22s ease;
    padding: 1rem; overflow-y: auto; font-family: system-ui, sans-serif; font-size: .9rem;
  }
  #toc.open { transform: none; }
  #toc a { display: block; padding: .4rem .5rem; border-radius: 6px; color: var(--ink); text-decoration: none; }
  #toc a:hover, #toc a[aria-current="true"] { background: var(--panel); }
  #toc .volhead { font-size: .7rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 1rem 0 .3rem; }
  #scrim { position: fixed; inset: 0; background: #0007; z-index: 15; opacity: 0; pointer-events: none; transition: opacity .22s; }
  #scrim.on { opacity: 1; pointer-events: auto; }
  #pager { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3rem; font-family: system-ui, sans-serif; font-size: .9rem; }
  #pager a { text-decoration: none; border: 1px solid var(--rule); border-radius: 8px; padding: .6rem .9rem; }
  #pager a:hover { border-color: var(--accent); }
  footer.shell { margin-top: 4rem; font-family: system-ui, sans-serif; font-size: .8rem; color: var(--muted); }
  @media print {
    #bar, #toc, #scrim, #pager, footer.shell { display: none !important; }
    main { max-width: none; padding: 0; }
    body { background: #fff; color: #000; }
  }
</style>
</head>
<body data-theme="light">

<header id="bar">
  <button id="menu" aria-label="Table of contents">☰</button>
  <a href="#/home" style="font-weight:600;color:var(--ink)">Repository</a>
  <span class="grow"></span>
  <a class="vol" data-vol="plain" href="#/plain/0">Plain</a>
  <a class="vol" data-vol="paper" href="#/paper/0">Paper</a>
  <a class="vol" data-vol="machine" href="#/machine/0">Machine</a>
  <a class="vol" data-vol="provenance" href="#/provenance/0">Provenance</a>
  <button id="theme" aria-label="Toggle theme">◐</button>
</header>

<div id="scrim"></div>
<nav id="toc" aria-label="Contents"></nav>

<main id="view" tabindex="-1"></main>

<script>
/* ============================================================
   1. MANIFEST — every section exists in every register.
   The 4 registers correspond to the 4 registers of the unit:
   plain, paper, machine, provenance.
   ============================================================ */
const SECTIONS = [
  { id: 0,  title: "Front matter" },
  { id: 1,  title: "Introduction" },
  { id: 2,  title: "Etymology" },
  { id: 3,  title: "Eleven senses" },
  { id: 4,  title: "Eight specifications" },
  { id: 5,  title: "Four conditions" },
  { id: 6,  title: "Information layers" },
  { id: 7,  title: "Security" },
  { id: 8,  title: "Composition" },
  { id: 9,  title: "Closure" },
  { id: 10, title: "Conclusion" },
];

/* ============================================================
   2. CONTENT — replace bodies with the unit's own content.
      Plain      = untrained register.
      Paper      = specialist text, unchanged.
      Machine    = YAML / structured data.
      Provenance = per-claim PROVENANCE object (Layer 2 projected).
   ============================================================ */
const CONTENT = {
  plain: {
    0: `<p class="lede">A plain-language way into the argument, for a reader with no prior background.</p>
        <p>People use the word <em>repository</em> for very different things: a place where software history lives, a place where packages are downloaded from, a library that promises to keep files for decades. This volume explains, in ordinary words, what those things share — and why the word is not just being stretched.</p>`,
    1: `<h2>Why this matters</h2><p>When two teams say "put it in the repository," they may mean two incompatible things. The plain volume fixes the shared meaning before the technical volume proves it.</p>`,
    2: `<h2>Where the word comes from</h2><p>Latin <em>repositorium</em>: a stand or tray — something that holds a thing, separate from the thing held. That separation is the seed of the whole argument.</p>`,
    3: `<h2>Eleven historical senses</h2><p>From a food tray to a tomb to a library to a Git repository: each one keeps the same four ingredients.</p>`,
    4: `<h2>Eight technical specifications</h2><p>Version control, package managers, container registries, the DDD pattern, institutional archives. Each one is <em>for</em> something distinct.</p>`,
    5: `<h2>The four conditions</h2><p>(1) It holds things and is where they live. (2) The organizing apparatus is separate from the raw content. (3) It promises preservation, retrieval, and a boundary. (4) It is the original, not a copy. Drop any one and you get a recognizable near-miss: a bare box, a folder, a cache, a mirror.</p>`,
    6: `<h2>Layers</h2><p>Every repository has raw content, an inflated organizing layer, and a deflated descriptor that points back to the raw content.</p>`,
    7: `<h2>Security</h2><p>Eight layers, from transport to isolation. Each layer protects against a specific failure.</p>`,
    8: `<h2>Composition</h2><p>Each specification decomposes into a counted list of components.</p>`,
    9: `<h2>Closure</h2><p>The paper says where it could be wrong (four falsifiers) and what is new (the synthesis, not the components).</p>`,
    10: `<h2>Conclusion</h2><p>Repository names one invariant across eleven senses and eight specifications. The four conditions are a checklist you can carry away.</p>`,
  },
  paper: {
    0: `<p class="kicker">Abstract</p><p>The English lexeme <em>repository</em> is used across software engineering, library and information science, package management, and institutional data governance as if it were univocal. It is not. This paper argues that the term names a single functional invariant — an authoritative, bounded, persistent holding environment whose organizational apparatus is separate from its raw content and which mediates access through an internal logic of preservation, retrieval, modification, distribution, or versioned reconstruction — instantiated across eleven attested historical senses and eight technical specifications.</p>`,
    1: `<h2>1. Introduction</h2><p>Three claims and one non-claim. (1) eleven senses re-instantiate one invariant; (2) eight specifications are distinct instantiations; (3) the invariant decomposes into four conditions individually necessary and jointly sufficient. Non-claim: the invariant is not newly discovered.</p>`,
    2: `<h2>2. Etymology</h2><p>Latin <em>repositorium</em> from <em>repositus</em>, past participle of <em>reponere</em> (<em>re-</em> "back" + <em>ponere</em> "to place"). Root sense: "put back in its proper place." Prototype present: a support structure separated from the thing supported.</p>`,
    3: `<h2>3. Diachrony</h2><p>Sense inventory S1–S11, count 11. Every sense satisfies Core A and at least one of B/C/D. Re-instantiation, not drift.</p>`,
    4: `<h2>4. Synchrony</h2><p>Specification inventory T1–T8, count 8. T5 is the storage-layer specification of T1, not a rival.</p>`,
    5: `<h2>5. Structure</h2><p>Four conditions: A (relational), B (structural), C (functional), D (authority). §5.3 argues C does not entail A (constructive counterexamples) and A does not entail C (analytic coherence). Each conjunct removable; four jointly sufficient.</p>`,
    6: `<h2>6. Information layers</h2><p>Raw (R), Inflated (I), Deflated (Δ). Metadata taxonomy: 16 classes, primary-function partition.</p>`,
    7: `<h2>7. Security</h2><p>Eight layers, closed. TUF: 5 roles, 7 threats, with threat-to-mitigation closure.</p>`,
    8: `<h2>8. Composition</h2><p>T1 (10), T2 (6), T3 (8), T4 (6), T5 (8), T6 (11), T7 (5), T8 (5).</p>`,
    9: `<h2>9. Closure</h2><p>Novelty boundary: component-novel, not component-invented. Seven resolved points. Four falsification conditions F1–F4.</p>`,
    10: `<h2>10. Conclusion</h2><p>Repository names a functional invariant. Conjunction A∧B∧C∧D. Each conjunct necessary; four jointly sufficient.</p>`,
  },
  machine: {
    0: `entity: repository_invariant
status: synthesis_over_public_components
conditions: [A, B, C, D]
necessity: each_removable
sufficiency: conjunction_sufficient
senses: 11
specifications: 8
falsifiers: [F1, F2, F3, F4]`,
    1: `claims:
  - id: 1
    text: eleven_senses_reinstantiate_one_invariant
  - id: 2
    text: eight_specs_distinct_layers_not_rival_definitions
  - id: 3
    text: four_conditions_necessary_and_jointly_sufficient
non_claim: invariant_not_newly_discovered`,
    2: `root:
  latin: repositorium
  verb: reponere
  sense: put_back_in_proper_place
  prototype:
    - support_separate_from_supported
    - placement_logic`,
    3: `senses:
  count: 11
  ids: [S1,S2,S3,S4,S5,S6,S7,S8,S9,S10,S11]
  membership_rule: OED_1a-6b_plus_technical_reinstantiation
  check: every_sense_satisfies_A_and_at_least_one_of_B_C_D`,
    4: `specifications:
  count: 8
  ids: [T1,T2,T3,T4,T5,T6,T7,T8]
  admission_rule: distinct_instantiation_and_distinguishable_apparatus
  T5: storage_layer_of_T1_not_rival`,
    5: `conditions:
  - id: A
    name: relational
    requires: [authoritative_holding_environment, persistence, access_mediation]
    failure_mode: bare_container
  - id: B
    name: structural
    requires: [apparatus_separate_from_raw]
    failure_mode: folder
  - id: C
    name: functional
    requires: [preservation_contract, retrieval_mechanism, purpose_boundary]
    failure_mode: cache
  - id: D
    name: authority
    requires: [server_of_record, not_derived_copy]
    failure_mode: mirror
necessity: remove_any_one_not_a_repository
sufficiency: A_and_B_and_C_and_D_is_repository`,
    6: `layers: [raw, inflated, deflated]
metadata_classes:
  count: 16
  partition: primary_function
  limitation: edge_cases_inferred`,
    7: `security_layers:
  count: 8
TUF:
  roles: 5
  threats: 7
threat_mitigation: every_layer_has_named_threat_and_mitigation`,
    8: `composition:
  T1: 10
  T2: 6
  T3: 8
  T4: 6
  T5: 8
  T6: 11
  T7: 5
  T8: 5`,
    9: `novelty: component_novel_not_invented
resolved_points: 7
falsifiers:
  - id: F1
    condition: attested_sense_satisfies_no_core
  - id: F2
    condition: spec_fails_B_yet_called_repository
  - id: F3
    condition: domain_without_apparatus_separation_treated_as_repository
  - id: F4
    condition: prior_publication_same_synthesis`,
    10: `conclusion:
  invariant: A_and_B_and_C_and_D
  necessity: each_conjunct
  sufficiency: four_conjuncts
  offered_as: contribution_to_terminology`,
  },
  provenance: {
    0: `# PROVENANCE — Layer 2 projected into the reader
# Each claim: id, asserted_by, verified_by, referent, status, falsifier
# The repository (not the unit) holds the pseudonym resolution.
claims: []`,
    1: `claims:
  - id: C-1-01
    text: repository_names_one_invariant
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [adversary-VM, verifier-VM]
    real_world_referent: { kind: derivation, ref: section-5.3 }
    status: resolved
    falsifier: F4`,
    2: `claims:
  - id: C-2-01
    text: root_sense_is_put_back_in_proper_place
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: citation, ref: LewisAndShort1879 }
    status: resolved
    falsifier: F1`,
    3: `claims:
  - id: C-3-01
    text: eleven_attested_senses
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: citation, ref: OED_senses_1a-6b }
    status: resolved
    falsifier: F1`,
    4: `claims:
  - id: C-4-01
    text: eight_technical_specifications
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: derivation, ref: T1-T8_inventory }
    status: resolved
    falsifier: F2`,
    5: `claims:
  - id: C-5-01
    text: C_does_not_entail_A
    asserted_by: pseudonym-author
    asserted_role: author-VM
    verified_by: [adversary-VM, verifier-VM]
    real_world_referent: { kind: derivation, ref: section-5.3 }
    status: resolved
    falsifier: F3
  - id: C-5-02
    text: A_does_not_entail_C
    asserted_by: pseudonym-author
    asserted_role: author-VM
    verified_by: [adversary-VM]
    real_world_referent: { kind: derivation, ref: section-5.3 }
    status: resolved
    falsifier: F3
  - id: C-5-03
    text: four_conditions_necessary_and_jointly_sufficient
    asserted_by: pseudonym-author
    asserted_role: author-VM
    verified_by: [adversary-VM, verifier-VM]
    real_world_referent: { kind: derivation, ref: section-5.3 }
    status: resolved
    falsifier: F3`,
    6: `claims:
  - id: C-6-01
    text: raw_inflated_deflated_layers
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: observation, ref: specification-survey }
    status: resolved
    falsifier: F2`,
    7: `claims:
  - id: C-7-01
    text: eight_security_layers
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: citation, ref: TUF_v1.0.31 }
    status: resolved
    falsifier: F2`,
    8: `claims:
  - id: C-8-01
    text: composition_counts_per_specification
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [verifier-VM]
    real_world_referent: { kind: derivation, ref: section-8 }
    status: resolved
    falsifier: F2`,
    9: `claims:
  - id: C-9-01
    text: four_falsification_conditions
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [adversary-VM]
    real_world_referent: { kind: derivation, ref: section-9.3 }
    status: resolved
    falsifier: F4`,
    10: `claims:
  - id: C-10-01
    text: invariant_is_conjunction_A_B_C_D
    asserted_by: pseudonym-author
    asserted_role: human
    verified_by: [adversary-VM, verifier-VM]
    real_world_referent: { kind: derivation, ref: section-5.3 }
    status: resolved
    falsifier: F3`,
  },
};

/* ============================================================
   3. ROUTER — hash based, per-register deep links.
   #/home          — front matter (landing, with bookmarks)
   #/plain/N       — section N, plain register
   #/paper/N       — section N, paper register
   #/machine/N     — section N, machine register
   #/provenance/N  — section N, provenance register
   ============================================================ */
const view = document.getElementById("view");
const toc = document.getElementById("toc");
const scrim = document.getElementById("scrim");
const VALID = ["plain", "paper", "machine", "provenance"];

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [vol, sid] = h.split("/");
  if (!vol || vol === "home") return { vol: "home", id: 0 };
  if (!VALID.includes(vol)) return { vol: "home", id: 0 };
  const raw = Number(sid);
  // Clamp into range: a stale or hand-typed deep link must never throw.
  const id = Number.isFinite(raw) ? Math.min(Math.max(Math.trunc(raw), 0), SECTIONS.length - 1) : 0;
  return { vol, id };
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render() {
  const { vol, id } = parseHash();

  if (vol === "home") {
    view.innerHTML = `
      <p class="kicker">A terminological analysis</p>
      <h1>Repository</h1>
      <p class="lede">A unit in four registers. Each bookmark is a direct link — experts can skip the beginner volume entirely.</p>
      <div class="bookmarks">
        <a class="bookmark" href="#/plain/0">
          <span class="tag">01 · PLAIN</span>
          <strong>Start here</strong>
          <span>No prior knowledge assumed. Ordinary words, everyday examples.</span>
        </a>
        <a class="bookmark" href="#/paper/0">
          <span class="tag">02 · PAPER</span>
          <strong>Expert volume</strong>
          <span>The full argument. For readers who already know the terrain.</span>
        </a>
        <a class="bookmark" href="#/machine/0">
          <span class="tag">03 · MACHINE</span>
          <strong>Machine register</strong>
          <span>Structured YAML. Every entity, condition, and count as a field.</span>
        </a>
        <a class="bookmark" href="#/provenance/0">
          <span class="tag">04 · PROVENANCE</span>
          <strong>Layer 2 projected</strong>
          <span>Per-claim record. Who asserted, who verified, what referent, what status.</span>
        </a>
      </div>
      <hr>
      <p style="font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)">
        Keyboard: <kbd>←</kbd> <kbd>→</kbd> page · <kbd>t</kbd> contents · <kbd>d</kbd> theme
      </p>
      <footer class="shell">Darkith Forge — the reader shell for <code>docs/DARKITH-OMEGA-repo.txt</code>.</footer>`;
    document.querySelectorAll("#bar .vol").forEach((a) => a.removeAttribute("aria-current"));
    return;
  }

  const sec = SECTIONS[id];
  const body = (CONTENT[vol] && CONTENT[vol][id]) || "<p>Content not yet loaded for this register.</p>";
  const isMachine = vol === "machine" || vol === "provenance";

  // Provenance spine: the per-claim record, projected inline into the reader
  // (except in the provenance register itself, which already is that record).
  const prov = CONTENT.provenance[id];
  const provBlock = (vol !== "provenance" && prov)
    ? `<details class="provenance"><summary>Provenance</summary><pre><code>${escapeHtml(prov)}</code></pre></details>`
    : "";

  view.innerHTML = `
    <p class="kicker">${escapeHtml(vol).toUpperCase()} · ${String(id).padStart(2, "0")} / ${SECTIONS.length - 1}</p>
    <h1>${escapeHtml(sec.title)}</h1>
    ${isMachine ? `<pre><code>${escapeHtml(body)}</code></pre>` : body}
    ${provBlock}
    <nav id="pager">
      ${id > 0 ? `<a href="#/${vol}/${id - 1}">← ${escapeHtml(SECTIONS[id - 1].title)}</a>` : `<a href="#/home">← Front matter</a>`}
      ${id < SECTIONS.length - 1 ? `<a href="#/${vol}/${id + 1}">${escapeHtml(SECTIONS[id + 1].title)} →</a>` : `<a href="#/home">Back to start →</a>`}
    </nav>`;

  document.querySelectorAll("#bar .vol").forEach((a) =>
    a.setAttribute("aria-current", String(a.dataset.vol === vol))
  );

  try { localStorage.setItem("repo-reader-pos", JSON.stringify({ vol, id })); } catch (e) {}
  buildToc(vol, id);
  view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function buildToc(vol, current) {
  toc.innerHTML =
    `<div class="volhead">${escapeHtml(vol)} register</div>` +
    SECTIONS.map((s) =>
      `<a href="#/${vol}/${s.id}" ${s.id === current ? 'aria-current="true"' : ""}>${String(s.id).padStart(2, "0")} · ${escapeHtml(s.title)}</a>`
    ).join("") +
    `<div class="volhead">Switch register</div>` +
    VALID.filter((v) => v !== vol)
      .map((v) => `<a href="#/${v}/${current}">${v}</a>`)
      .join("") +
    `<a href="#/home" style="margin-top:.8rem">↩ Front matter</a>`;
}

/* ============================================================
   4. CONTROLS
   ============================================================ */
document.getElementById("menu").onclick = () => {
  toc.classList.add("open");
  scrim.classList.add("on");
};
scrim.onclick = () => {
  toc.classList.remove("open");
  scrim.classList.remove("on");
};

document.getElementById("theme").onclick = () => {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  try { localStorage.setItem("repo-theme", next); } catch (e) {}
};
try { document.body.dataset.theme = localStorage.getItem("repo-theme") || "light"; } catch (e) {}

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  const { vol, id } = parseHash();
  if (vol === "home") return;
  if (e.key === "ArrowRight" && id < SECTIONS.length - 1) location.hash = `#/${vol}/${id + 1}`;
  if (e.key === "ArrowLeft") location.hash = id > 0 ? `#/${vol}/${id - 1}` : "#/home";
  if (e.key === "t") document.getElementById("menu").click();
  if (e.key === "d") document.getElementById("theme").click();
});

window.addEventListener("hashchange", render);

/* resume prompt */
(function resume() {
  try {
    const saved = JSON.parse(localStorage.getItem("repo-reader-pos") || "null");
    if (saved && VALID.includes(saved.vol) && Number.isFinite(saved.id) && location.hash === "") {
      setTimeout(() => {
        if (confirm(`Resume where you left off — ${saved.vol} register, section ${saved.id}?`)) {
          location.hash = `#/${saved.vol}/${saved.id}`;
        }
      }, 60);
    }
  } catch (e) {}
})();

render();
</script>
</body>
