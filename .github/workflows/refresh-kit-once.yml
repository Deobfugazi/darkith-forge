name: refresh portable kit once

on:
  push:
    branches: [fix/ci-red-2026-11-20-v3]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Regenerate and test portable kit
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 build/make-coordinasync.py
          python3 kit/coordinasync.py selftest
          git diff --check
          if ! git diff --quiet; then
            git config user.name "darkith-artifact-repair"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add kit/coordinasync.py
            git commit -m "build: refresh portable kit from canonical tools"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
