name: Publish interactive README
on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/index.html
      - docs/sw.js
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate reader JavaScript
        run: |
          node -e 'const fs=require("fs");const html=fs.readFileSync("docs/index.html","utf8");const match=html.match(/<script>([\s\S]*?)<\/script>/);if(!match)throw Error("reader script missing");new Function(match[1]);'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Assemble reader
        run: |
          cp README.md docs/README.md
          touch docs/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
