# Dependency auto-merge — a thin GitHub adapter for tools/darkbot.py + tools/ci.sh.
#
# Everything that decides anything lives in tools/ (darkbot.py, ci.sh, deps.txt), which
# are provider-neutral. This file is only the GitHub-specific glue: when to run, and how
# to merge. Move to another host and you rewrite this file, never the tools.
#
# Dependency changes are tested on isolated trial-net branches.
# This workflow never merges PRs and never writes dependency commits to main.
# Scheduled dependency updates are committed only to a unique trial-net branch,
# tested at the exact candidate SHA, then submitted as a draft PR for review.
# GITHUB_TOKEN-created PRs do not trigger a new pull_request workflow run, so
# the scheduled run itself carries the full test proof for that candidate.
# Main remains unchanged if any test, race check, or PR creation step fails.

name: dependency auto-merge

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC — darkbot proposes pin bumps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Test the event's exact tree in detached HEAD. CI repair commits must never
          # create a local main branch that remote-state gates mistake for published work.
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies (generated from tools/deps.txt)
        run: |
          python3 tools/darkbot.py export
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage the raw-chain toolchain (kotlinc + android.jar + apksig)
        # The §19 compile proof (MUST-11) and the delivery gate's currency law need a real
        # kotlinc + android.jar; without them those gates fail CLOSED, not skip. The stager
        # is idempotent and caches into .tools/ (gitignored).
        run: bash tools/fetch_toolchain.sh

      - name: Run the repository's tests (tools/ci.sh)
        run: bash tools/ci.sh

  bump:
    name: darkbot bump (trial-net only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record the exact base commit
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Bump pins to the latest registry versions
        id: bump
        run: |
          python3 tools/darkbot.py update
          python3 tools/darkbot.py export
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop when no dependency changes exist
        if: steps.bump.outputs.changed != 'true'
        run: echo "No dependency updates; main and trial-net remain unchanged."

      - name: Install test dependencies
        if: steps.bump.outputs.changed == 'true'
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage the raw-chain toolchain (kotlinc + android.jar + apksig)
        if: steps.bump.outputs.changed == 'true'
        run: bash tools/fetch_toolchain.sh

      - name: Commit candidate locally, then validate that exact commit
        if: steps.bump.outputs.changed == 'true'
        id: candidate
        run: |
          git config user.name "darkbot"
          git config user.email "darkbot@users.noreply.github.com"
          git add tools/deps.txt requirements-dev.txt
          git commit -m "darkbot: propose dependency pin updates on trial-net"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          bash tools/ci.sh

      - name: Reject a stale candidate if main moved during validation
        if: steps.bump.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git fetch origin main
          LIVE_MAIN="$(git rev-parse origin/main)"
          if [ "$LIVE_MAIN" != "$BASE_SHA" ]; then
            echo "::error::main moved during trial-net validation; refusing to publish candidate."
            exit 1
          fi

      - name: Publish the tested candidate to an isolated trial-net branch
        if: steps.bump.outputs.changed == 'true'
        id: publish
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          BRANCH="trial-net/dependency-bumps-${GITHUB_RUN_ID}"
          git push origin "$CANDIDATE_SHA:refs/heads/$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open a draft PR for human review; never merge automatically
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.publish.outputs.branch }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "Trial-net dependency update ($GITHUB_RUN_ID)" \
            --body "Automated dependency candidate.\n\nBase: $BASE_SHA\nCandidate: $CANDIDATE_SHA\n\nThe exact candidate commit passed `bash tools/ci.sh` in the scheduled workflow before publication. This PR is draft-only and is not auto-merged. Review the run and all required checks before promotion."
