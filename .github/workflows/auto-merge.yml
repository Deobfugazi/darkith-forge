# Candidate-only CI. Main is a protected destination, never a test target.
# Full tests execute on pull-request merge candidates or an explicitly selected
# non-main candidate branch. This workflow does not push, merge, release, or deploy.
# Dependency bump automation is intentionally disabled until it can create a
# candidate PR without publishing directly to main and can bind admission to that SHA.

name: dependency candidate admission

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-ci:
    name: candidate CI (pre-admission)
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref != 'refs/heads/main' &&
       github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact candidate event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies (generated from tools/deps.txt)
        run: |
          python3 tools/darkbot.py export
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage the raw-chain toolchain (kotlinc + android.jar + apksig)
        run: bash tools/fetch_toolchain.sh

      - name: Run full repository CI on the candidate
        run: bash tools/ci.sh
