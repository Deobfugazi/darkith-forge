# Darkith admission pipeline.
# A main-bound testnet PR is repaired and carried on its own branch, then tested twice
# on the exact same SHA in fresh runners. Only those two green trials may admit it to main.
# CI itself is read-only; repair is isolated to the PR/testnet branch.

name: Darkith admission and dependency automation

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      testnet_pr:
        description: "PR number to trial twice and auto-admit (testnet branch only)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: darkith-admission-${{ github.event.pull_request.number || inputs.testnet_pr || github.ref }}
  cancel-in-progress: true

jobs:
  prepare_testnet:
    name: testnet preflight repair and carry
    if: >
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'testnet/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.testnet_pr != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      sha: ${{ steps.carry.outputs.sha }}
      branch: ${{ steps.resolve.outputs.branch }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
    steps:
      - name: Check out main as authenticated workspace
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Resolve and validate testnet PR
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_PR: ${{ inputs.testnet_pr }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr="${EVENT_PR:-${DISPATCH_PR}}"
          [ -n "$pr" ] || { echo "::error::No PR number"; exit 1; }
          view="$(gh pr view "$pr" --json headRefName,headRefOid,baseRefOid,headRepository)"
          branch="$(jq -r .headRefName <<<"$view")"
          head_repo="$(jq -r .headRepository.nameWithOwner <<<"$view")"
          head_sha="$(jq -r .headRefOid <<<"$view")"
          base_sha="$(jq -r .baseRefOid <<<"$view")"
          [ "$head_repo" = "$REPO" ] || { echo "::error::Fork PRs are not eligible for automatic admission"; exit 1; }
          [[ "$branch" == testnet/* ]] || { echo "::error::Admission branch must begin testnet/"; exit 1; }
          if [ -n "$EVENT_BRANCH" ]; then
            [ "$branch" = "$EVENT_BRANCH" ] || { echo "::error::PR branch changed during resolution"; exit 1; }
            [ "$EVENT_HEAD_REPO" = "$REPO" ] || { echo "::error::Head repository mismatch"; exit 1; }
          fi
          echo "pr_number=$pr" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out the testnet branch
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          EXPECTED_HEAD: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          git checkout -B "$BRANCH" "refs/remotes/origin/$BRANCH"
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$EXPECTED_HEAD" ] || {
            echo "::error::PR head moved before preflight (resolved $EXPECTED_HEAD, fetched $actual)"
            exit 1
          }

      - name: Set up Python and Node
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install repair and test toolchain
        run: |
          set -euo pipefail
          python3 tools/darkbot.py export
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          bash tools/fetch_toolchain.sh

      - name: Heal to fixed point, validate, and carry only on testnet
        id: carry
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          DARKITH_DEFER_PUSH: "1"
          # Repair subprocesses may publish intermediate testnet commits. Export the
          # narrowly authorized testnet bypass BEFORE any repair runs, so nested pushes
          # cannot recursively launch the full pre-push rehearsal.
          ADMISSION_BYPASS: "1"
          ADMISSION_BYPASS_REASON: "two independent testnet trials gate main"
        run: |
          set -euo pipefail
          branch="$(git rev-parse --abbrev-ref HEAD)"
          [ "$branch" = "$BRANCH" ] || { echo "::error::Refusing repair outside the resolved testnet branch"; exit 1; }
          case "$branch" in testnet/*) ;; *) echo "::error::Refusing bypass outside testnet"; exit 1;; esac
          python3 tools/secret_gate.py
          python3 tools/absolution_phase.py
          python3 tools/secret_gate.py
          python3 tools/absolution_phase.py --check
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "darkith-testnet"
            git config user.email "darkith-testnet@users.noreply.github.com"
            git commit -m "testnet: carry prophylactic repairs to fixed point"
          fi
          # Keep the explicit testnet-only bypass active through the final testnet publication; main admission remains gated by both isolated trials.
          unset DARKITH_DEFER_PUSH
          git push origin "HEAD:refs/heads/$BRANCH"
          git fetch origin "refs/heads/$BRANCH"
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse FETCH_HEAD)"
          [ "$local_sha" = "$remote_sha" ] || {
            echo "::error::Testnet branch moved during carry (local $local_sha remote $remote_sha)"
            exit 1
          }
          python3 tools/absolution_phase.py --check
          python3 tools/admission.py
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "::error::Preflight left uncarrried residue after commit"
            exit 1
          fi
          echo "sha=$local_sha" >> "$GITHUB_OUTPUT"

  trial_1:
    name: testnet trial 1/2
    needs: prepare_testnet
    if: >
      always() &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.testnet_pr != '')) &&
      (needs.prepare_testnet.result == 'success' || needs.prepare_testnet.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare_testnet.outputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 tools/darkbot.py export
          git diff --exit-code -- tools/deps.txt requirements-dev.txt
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          bash tools/fetch_toolchain.sh

      - name: Run admission preflight and full isolated CI trial 1
        run: |
          set -euo pipefail
          python3 tools/admission.py
          python3 tools/admission.py rehearse
          test "$(git rev-parse HEAD)" = "${{ needs.prepare_testnet.outputs.sha || github.event.pull_request.head.sha }}"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "::error::CI trial 1 mutated the candidate tree"
            exit 1
          fi
      - name: Preserve trial 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admission-trial-1-${{ github.run_id }}
          path: proof/admission/*.log
          if-no-files-found: error

  trial_2:
    name: testnet trial 2/2
    needs: [prepare_testnet, trial_1]
    if: >
      always() &&
      needs.trial_1.result == 'success' &&
      (needs.prepare_testnet.result == 'success' || needs.prepare_testnet.result == 'skipped') &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.testnet_pr != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the same exact candidate SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare_testnet.outputs.sha || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 tools/darkbot.py export
          git diff --exit-code -- tools/deps.txt requirements-dev.txt
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          bash tools/fetch_toolchain.sh

      - name: Run admission preflight and full isolated CI trial 2
        run: |
          set -euo pipefail
          python3 tools/admission.py
          python3 tools/admission.py rehearse
          test "$(git rev-parse HEAD)" = "${{ needs.prepare_testnet.outputs.sha || github.event.pull_request.head.sha }}"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short
            echo "::error::CI trial 2 mutated the candidate tree"
            exit 1
          fi
      - name: Preserve trial 2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admission-trial-2-${{ github.run_id }}
          path: proof/admission/*.log
          if-no-files-found: error

  tests:
    name: tests
    needs: [trial_1, trial_2]
    if: >
      always() &&
      needs.trial_1.result == 'success' &&
      needs.trial_2.result == 'success' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'workflow_dispatch' && inputs.testnet_pr != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Confirm both independent trial jobs passed
        run: echo "Both isolated admission trials passed on the same candidate SHA."

  post_push:
    name: post-push CI
    if: github.event_name != 'pull_request' &&
        !(github.event_name == 'workflow_dispatch' && inputs.testnet_pr != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install test dependencies
        run: |
          set -euo pipefail
          python3 tools/darkbot.py export
          git diff --exit-code -- tools/deps.txt requirements-dev.txt
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          bash tools/fetch_toolchain.sh
      - name: Run post-push admission rehearsal
        run: |
          set -euo pipefail
          python3 tools/admission.py
          python3 tools/admission.py rehearse

  merge_testnet:
    name: auto-admit verified testnet PR
    needs: [prepare_testnet, trial_1, trial_2, tests]
    if: >
      needs.prepare_testnet.result == 'success' &&
      needs.tests.result == 'success' &&
      needs.trial_1.result == 'success' &&
      needs.trial_2.result == 'success' &&
      ((github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'testnet/')) ||
       (github.event_name == 'workflow_dispatch' && inputs.testnet_pr != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify two-trial evidence and unchanged candidate/base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare_testnet.outputs.pr_number }}
          TESTED_SHA: ${{ needs.prepare_testnet.outputs.sha }}
          TESTED_BASE: ${{ needs.prepare_testnet.outputs.base_sha }}
        run: |
          set -euo pipefail
          view="$(gh pr view "$PR_NUMBER" --json headRefOid,baseRefOid,state,isDraft)"
          live_head="$(jq -r .headRefOid <<<"$view")"
          live_base="$(jq -r .baseRefOid <<<"$view")"
          state="$(jq -r .state <<<"$view")"
          [ "$state" = OPEN ] || { echo "::error::PR is not open"; exit 1; }
          [ "$live_head" = "$TESTED_SHA" ] || {
            echo "::error::Candidate changed after trials (tested $TESTED_SHA, live $live_head)"
            exit 1
          }
          [ "$live_base" = "$TESTED_BASE" ] || {
            echo "::error::Main changed after trials (tested base $TESTED_BASE, live $live_base)"
            exit 1
          }
          echo "Two full CI trials passed on $TESTED_SHA against unchanged main $TESTED_BASE."

      - name: Promote and squash-merge after both trials
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.prepare_testnet.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr ready "$PR_NUMBER" || true
          gh pr merge "$PR_NUMBER" --squash --delete-branch

  merge_dependency:
    name: auto-merge tested dependency PR
    needs: [trial_1, trial_2, tests]
    if: >
      github.event_name == 'pull_request' &&
      needs.trial_1.result == 'success' &&
      needs.trial_2.result == 'success' &&
      needs.tests.result == 'success' &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       github.event.pull_request.user.login == 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse a moved dependency PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          view="$(gh pr view "$PR_URL" --json headRefOid,baseRefOid)"
          live="$(jq -r .headRefOid <<<"$view")"
          base="$(jq -r .baseRefOid <<<"$view")"
          [ "$live" = "$TESTED_SHA" ] || {
            echo "::error::PR head moved after trial; refusing merge"
            exit 1
          }
          [ "$base" = "$TESTED_BASE" ] || {
            echo "::error::Base moved after trial; refusing merge"
            exit 1
          }
          gh pr merge "$PR_URL" --squash --delete-branch

  bump:
    name: darkbot dependency proposal (never direct-main push)
    if: github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.testnet_pr == '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Propose dependency pins on an isolated testnet branch
        id: proposal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 tools/darkbot.py update
          python3 tools/darkbot.py export
          if git diff --quiet -- tools/deps.txt requirements-dev.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="testnet/darkbot-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add tools/deps.txt requirements-dev.txt
          git config user.name "darkbot"
          git config user.email "darkbot@users.noreply.github.com"
          git commit -m "darkbot: propose dependency pin updates"
          git push -u origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch"             --title "testnet: darkbot dependency pin proposal"             --body "Automated dependency proposal. This branch is repaired, carried, and subjected to two independent full CI trials by the Darkith admission workflow before any main merge.")"
          pr_number="${pr_url##*/}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Dispatch the two-trial testnet admission
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.proposal.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh workflow run auto-merge.yml --ref main -f testnet_pr="$PR_NUMBER"
