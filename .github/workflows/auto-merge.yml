# Dependency maintenance is candidate-only.
# Scheduled updates are tested on a disposable branch and opened as a PR.
# This workflow never pushes to main and never merges a PR.

name: dependency auto-merge

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: |
          python3 tools/darkbot.py export
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage required toolchain
        run: bash tools/fetch_toolchain.sh

      - name: Run repository CI
        run: bash tools/ci.sh

  dependency_candidate:
    name: propose dependency candidate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Update pins
        id: bump
        run: |
          python3 tools/darkbot.py update
          python3 tools/darkbot.py export
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install candidate test dependencies
        if: steps.bump.outputs.changed == 'true'
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage required toolchain
        if: steps.bump.outputs.changed == 'true'
        run: bash tools/fetch_toolchain.sh

      - name: Validate candidate before publishing branch
        if: steps.bump.outputs.changed == 'true'
        run: bash tools/ci.sh

      - name: Publish tested candidate branch and open PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="darkbot/dependency-candidate-$(date -u +%Y%m%d%H%M%S)"
          git config user.name "darkbot"
          git config user.email "darkbot@users.noreply.github.com"
          git add tools/deps.txt requirements-dev.txt
          git commit -m "darkbot: propose tested dependency pin update"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create \
            --repo "$REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "darkbot: dependency update candidate" \
            --body "Automated dependency candidate. Full repository CI passed on this exact candidate before branch publication. This workflow does not merge; review and required branch checks remain mandatory."
