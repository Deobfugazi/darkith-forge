# Dependabot auto-merge — a thin GitHub adapter.
#
# The TESTS are not here. They live in tools/ci.sh, which is provider-neutral: the same
# script runs on GitLab, Bitbucket, Jenkins, CircleCI, or a phone in Termux. This file
# only decides *who* to merge and *when*, so moving hosts means rewriting this adapter,
# never the tests.
#
# How it works:
#   1. `tests` runs tools/ci.sh on every pull request.
#   2. `auto-merge` needs `tests` to have succeeded AND the author to be Dependabot.
# A Dependabot PR is merged if — and only if — tools/ci.sh exits 0.
#
# Security:
#   * Actions are pinned to full commit SHAs, not mutable tags. A tag like @v4 can be
#     repointed at malicious code; a SHA cannot. (This is the supply-chain loophole.)
#   * Least privilege: read-only by default; only the merge job is granted write.
#   * The Dependabot author check uses the immutable login, not a branch name, so a
#     fork cannot impersonate Dependabot by naming a branch.

name: Dependabot auto-merge

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install test dependencies (versioned in requirements-dev.txt)
        run: |
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Run the repository's tests (tools/ci.sh)
        run: bash tools/ci.sh

  auto-merge:
    name: auto-merge Dependabot PR
    needs: tests
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge (prefer GitHub auto-merge, fall back to direct squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash --delete-branch "$PR_URL" \
            || gh pr merge --squash --delete-branch "$PR_URL"
