name: isolated revitalization recovery

on:
  push:
    branches:
      - fix/ci-recurring-red-root-causes-2026-11-23
    paths-ignore:
      - 'proof/convergence.json'
      - 'proof/revitalization/**'
      - 'proof/board_pulse.json'
      - 'TASKS.md'

permissions:
  contents: write

concurrency:
  group: isolated-revitalization-recovery
  cancel-in-progress: false

jobs:
  reseal:
    name: reseal and verify isolated branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the isolated repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/ci-recurring-red-root-causes-2026-11-23
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install repository test dependencies
        run: |
          python3 tools/darkbot.py export
          python3 -m pip install --quiet -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium

      - name: Stage the raw-chain toolchain
        run: bash tools/fetch_toolchain.sh

      - name: Refresh, commit, and publish convergence baseline before S01
        env:
          ADMISSION_BOOTSTRAP_SEAL_PENDING: "1"
        run: |
          python3 tools/convergence_gate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/convergence.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(proof): refresh convergence receipt before seal"
          fi
          # The CI probes enforce NEVER #21 and MUST #26: a local-only commit
          # makes both the authority gate and board-pulse gate fail. Publish this
          # generated baseline on the isolated branch before starting S01.
          git push origin "HEAD:refs/heads/fix/ci-recurring-red-root-causes-2026-11-23"

      - name: Execute the complete serial revitalization cycle
        run: python3 tools/revitalization.py run

      - name: Push only the sealed repair-branch commit
        run: git push origin "HEAD:refs/heads/fix/ci-recurring-red-root-causes-2026-11-23"

      - name: Checkout the exact landed repair-branch bytes
        run: |
          git fetch origin fix/ci-recurring-red-root-causes-2026-11-23
          git checkout -B fix/ci-recurring-red-root-causes-2026-11-23 origin/fix/ci-recurring-red-root-causes-2026-11-23

      - name: Verify the complete sealed receipt chain
        run: python3 tools/revitalization.py gate

      - name: Re-run the complete repository CI on the sealed bytes
        run: bash tools/ci.sh
