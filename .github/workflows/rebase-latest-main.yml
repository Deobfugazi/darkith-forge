name: rebase repair branch on latest main

on:
  push:
    branches: [fix/ci-red-2026-11-20-v3]

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"
      - name: Merge latest main and refresh generated artifacts
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "darkith-ci-repair"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            # The source-of-truth chat ingester and its generated index may overlap the
            # upstream repair. Keep main's current versions, then regenerate the kit/index.
            for path in tools/chat_gatekeeper.py docs/INDEX.md docs/kb_manifest.json; do
              git checkout origin/main -- "$path" || true
              git add "$path" || true
            done
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved merge paths:"
              printf '%s\n' "$unresolved"
              exit 1
            fi
            git commit --no-edit
          fi
          python3 tools/board_header_gate.py --fix
          python3 build/make-coordinasync.py
          python3 tools/kb_index.py --write
          python3 tools/board_header_gate.py --check
          python3 tools/kb_index.py
          python3 kit/coordinasync.py selftest
          git diff --check
          if ! git diff --quiet; then
            git add TASKS.md docs/INDEX.md docs/kb_manifest.json kit/coordinasync.py
            git commit -m "repair: regenerate artifacts after main sync"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"
