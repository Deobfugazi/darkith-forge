# Dependabot — keeps dependencies current and opens the pull requests that
# `.github/workflows/dependabot-auto-merge.yml` merges once tests pass.
#
# Only ecosystems this repository actually uses are listed. Adding an entry for
# a package manager with no manifest produces nothing but noise.
version: 2
updates:
  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "github-actions"]

  # Python test/build dependencies (see requirements-dev.txt).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels: ["dependencies", "python"]
