<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Darkith — Interactive README</title>
<style>
:root{--bg:#0b0e12;--panel:#151a20;--text:#e9eef3;--muted:#aab6c2;--line:#34404c;--link:#a6ceff;--accent:#83d5c4;--size:1rem;--width:78ch}:root[data-theme=light]{--bg:#f5f7f9;--panel:#fff;--text:#18212a;--muted:#4e5c69;--line:#cbd4dc;--link:#075db5;--accent:#086b5a}:root[data-contrast=high]{--text:#fff;--muted:#e8edf2;--line:#fff;--link:#8bd0ff;--accent:#7dffdb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:var(--size)/1.65 system-ui,sans-serif}a{color:var(--link);text-underline-offset:.18em}button,input,select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:.55rem;padding:.5rem .7rem}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:3}.bar{max-width:1400px;margin:auto;padding:.7rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}.brand{font-weight:800;letter-spacing:.08em;margin-right:auto}.search{min-width:15rem;flex:1}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:15rem minmax(0,1fr);gap:1rem;padding:1rem}nav{position:sticky;top:5rem;align-self:start;max-height:calc(100vh - 6rem);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:.7rem}nav a{display:block;padding:.3rem;color:var(--muted);text-decoration:none;font-size:.88rem}nav a.sub{padding-left:1rem;font-size:.82rem}main{min-width:0}article{max-width:var(--width);margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:clamp(1rem,3vw,2.5rem);overflow-wrap:anywhere}h1,h2,h3{line-height:1.25;scroll-margin-top:6rem}h1{font-size:2rem}h2{font-size:1.55rem;border-bottom:1px solid var(--line);padding-bottom:.4rem;margin-top:2rem}h3{font-size:1.2rem;margin-top:1.5rem}strong{color:var(--accent)}code{font:.88em ui-monospace,monospace;background:#252d36;padding:.12em .3em;border-radius:.25em}pre{overflow:auto;background:#080a0d;padding:1rem;border-radius:.6rem;border:1px solid var(--line)}pre code{background:none;color:#e9eef3}table{border-collapse:collapse;display:block;overflow:auto;width:100%;margin:1rem 0}th,td{border:1px solid var(--line);padding:.5rem;text-align:left;vertical-align:top}details{border:1px solid var(--line);border-radius:.6rem;padding:.65rem;margin:1rem 0}summary{cursor:pointer;font-weight:700}hr{border:0;border-top:1px solid var(--line);margin:2rem 0}.status{color:var(--muted);font-size:.85rem;padding:.5rem}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr;padding:.6rem}nav{position:static;max-height:15rem}.brand{width:100%}article{padding:1rem}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body>
<header><div class="bar"><div class="brand">DARKITH / INTERACTIVE FIELD GUIDE</div><input class="search" id="q" type="search" placeholder="Search this README… ( / )" aria-label="Search"><button id="clear">Clear</button><select id="size" aria-label="Text size"><option value=".9">Small</option><option value="1" selected>Default</option><option value="1.15">Large</option><option value="1.3">XL</option></select><select id="theme" aria-label="Theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select><button id="contrast" aria-pressed="false">High contrast</button><button id="wide" aria-pressed="false">Wide</button><button id="expand">Expand context</button></div></header>
<div class="layout"><nav aria-label="Document navigation"><strong>CONTENTS</strong><div id="toc" class="status">Constructing…</div></nav><main><div id="status" class="status" role="status" aria-live="polite">Loading canonical README…</div><article id="doc"><p>Loading source…</p></article></main></div>
<script>
(function(){
const $=id=>document.getElementById(id),doc=$('doc'),status=$('status'),root=document.documentElement;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function slug(s){return s.toLowerCase().replace(/<[^>]*>/g,'').replace(/[^\w\s-]/g,'').trim().replace(/\s+/g,'-').replace(/-+/g,'-')}
function inline(s){s=esc(s);let tick=String.fromCharCode(96);s=s.replace(new RegExp(tick+'([^'+tick+']+)'+tick,'g'),'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,function(_,label,url){if(url.charAt(0)!=='#'&&!/^https?:|^mailto:/i.test(url))url='https://github.com/Deobfugazi/darkith-forge/blob/main/'+url.replace(/^\.\//,'');return '<a href="'+esc(url)+'">'+label+'</a>'});return s}
function render(md){let L=md.replace(/\r/g,'').split('\n'),o='',i=0,list='';
function close(){if(list){o+='</'+list+'>';list=''}}
while(i<L.length){let x=L[i];
if(x.charCodeAt(0)===96||x.startsWith('~~~')){close();let f=x.charCodeAt(0)===96?String.fromCharCode(96).repeat(3):'~~~';i++;let c=[];while(i<L.length&&L[i].charCodeAt(0)!==96&&!L[i].startsWith(f))c.push(L[i++]);i++;o+='<pre><code>'+esc(c.join('\n'))+'</code></pre>';continue}
if(/^#{1,6}\s/.test(x)){close();let n=x.match(/^#+/)[0].length,t=x.replace(/^#+\s*/,'').replace(/\s+#+\s*$/,'');o+='<h'+n+' id="'+slug(t)+'">'+inline(t)+'</h'+n+'>';i++;continue}
if(/^<details>|^<\/details>|^<summary>|^<\/summary>/.test(x)){close();o+=x;i++;continue}
if(/^\s*[-*+]\s+/.test(x)||/^\s*\d+\.\s+/.test(x)){let ordered=/^\s*\d+\.\s+/.test(x),tag=ordered?'ol':'ul';if(list!==tag){close();list=tag;o+='<'+tag+'>'}o+='<li>'+inline(x.replace(/^\s*(?:[-*+]|\d+\.)\s+/,''))+'</li>';i++;continue}
if(/^>\s?/.test(x)){close();o+='<blockquote><p>'+inline(x.replace(/^>\s?/,''))+'</p></blockquote>';i++;continue}
if(/^---+$/.test(x.trim())){close();o+='<hr>';i++;continue}
if(!x.trim()){close();i++;continue}
close();let p=[];while(i<L.length&&L[i].trim()&&!/^#{1,6}\s|^<details>|^<\/details>|^<summary>|^<\/summary>|^\s*[-*+]\s|^\s*\d+\.\s|^>\s?|^---+$/.test(L[i])&&L[i].charCodeAt(0)!==96)p.push(L[i++]);o+='<p>'+inline(p.join(' '))+'</p>';
}close();return o}
function toc(){let hs=[...doc.querySelectorAll('h1,h2,h3')];$('toc').innerHTML=hs.map(h=>'<a class="'+(h.tagName==='H3'?'sub':'')+'" href="#'+h.id+'">'+esc(h.textContent)+'</a>').join('')}
function search(){let q=$('q').value.toLowerCase().trim(),n=0;[...doc.children].forEach(x=>{let hit=!q||x.textContent.toLowerCase().includes(q);x.classList.toggle('hidden',!hit);if(hit&&q)n++});status.textContent=q?n+' matching blocks. Enter jumps to the first.':'README loaded. Search, navigate, expand context, and adjust your reading interface.'}
function save(){localStorage.setItem('darkith-reader',JSON.stringify({size:$('size').value,theme:$('theme').value,contrast:root.dataset.contrast==='high',wide:root.style.getPropertyValue('--width')==='105ch'}))}
try{let p=JSON.parse(localStorage.getItem('darkith-reader')||'{}');if(p.size)$('size').value=p.size;if(p.theme)$('theme').value=p.theme;if(p.contrast)root.dataset.contrast='high';if(p.wide)root.style.setProperty('--width','105ch')}catch(e){}
root.style.setProperty('--size',$('size').value+'rem');if($('theme').value!=='system')root.dataset.theme=$('theme').value;
$('size').onchange=()=>{root.style.setProperty('--size',$('size').value+'rem');save()};$('theme').onchange=()=>{if($('theme').value==='system')delete root.dataset.theme;else root.dataset.theme=$('theme').value;save()};
$('contrast').onclick=()=>{let on=root.dataset.contrast!=='high';if(on)root.dataset.contrast='high';else delete root.dataset.contrast;$('contrast').setAttribute('aria-pressed',on);save()};
$('wide').onclick=()=>{let on=root.style.getPropertyValue('--width')!=='105ch';root.style.setProperty('--width',on?'105ch':'78ch');$('wide').setAttribute('aria-pressed',on);save()};
$('expand').onclick=()=>{let d=[...doc.querySelectorAll('details')],open=d.some(x=>!x.open);d.forEach(x=>x.open=open);$('expand').textContent=open?'Collapse context':'Expand context'};
$('q').oninput=search;$('clear').onclick=()=>{$('q').value='';search();$('q').focus()};$('q').onkeydown=e=>{if(e.key==='Enter'){let x=[...doc.children].find(x=>!x.classList.contains('hidden'));if(x)x.scrollIntoView({block:'start'})}};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}if(e.key==='Escape'){$('q').value='';search()}});
fetch('README.md').then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>{doc.innerHTML=render(t);toc();search()}).catch(e=>{status.textContent='Canonical README unavailable: '+e.message;doc.innerHTML='<h1>Source unavailable</h1><p><a href="https://github.com/Deobfugazi/darkith-forge/blob/main/README.md">Open the canonical README on GitHub</a>.</p>'});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
