const CONTENT = {
  plain: {
    0: `<p class="lede">A plain-language way into the argument, for a reader with no prior background.</p>
        <p>This document describes one thing: a workshop that builds software <em>on a telephone</em>. No laptop. No internet. No tool that hides what it is doing. You type or tap an intent; the workshop measures what is missing; it makes the missing thing; it checks its own work; and it hands back a signed file the phone will install.</p>
        <p>That is unusual enough that the rest of this document has to prove it is real, and has to say exactly where it could be wrong.</p>`,
    1: `<h2>Why this matters</h2>
        <p>Most software is built on someone else's machine, using someone else's tools, and you are told to trust the result. This workshop is built so that the person holding the phone can walk every step. If a step is fake, a check fails and the build stops. Nothing is allowed to "look finished."</p>
        <p>The document makes three claims and one honest non-claim. The claims: the workshop runs the whole build itself; it repairs what it lacks instead of guessing; and its repair is measured, not asserted. The non-claim: almost none of the individual parts are new. The <em>arrangement</em> is the contribution.</p>`,
    2: `<h2>Where the word comes from</h2>
        <p>A <em>manufactory</em> is older than a factory. Latin <em>manufactorium</em> joins <em>manus</em> (hand) to <em>facere</em> (to make): a place where something is made by hand. A factory is a place of machines. A manufactory is a place where the hand and the machine are joined.</p>
        <p>That distinction is the whole design. The hand derives the rule. The machine executes it. Neither is allowed to pretend to be the other.</p>`,
    3: `<h2>Eleven engines</h2>
        <p>The workshop has eleven working parts. Some turn a web page into native screen instructions. Some compile. Some find what is missing and fetch it. Some decide how much memory a job may take. Some keep a permanent, tamper-evident record of every decision.</p>
        <p>Eleven sounds arbitrary until you see that each one answers a different question, and that no two answer the same question. That is the test: if two parts answered the same question, one of them would be a copy, and copies drift.</p>`,
    4: `<h2>Eight specifications</h2>
        <p>Under the eleven parts sit eight kinds of repository — the storage ideas the workshop depends on. A version history. A package shelf. A container registry. A named storage pattern from domain design. An institutional archive. A content-addressed store. A build cache. A release channel.</p>
        <p>They are not rivals. They are the same idea at different depths: something authoritative holds things; a separate organising layer says what they are; and a promise says they will still be there later.</p>`,
    5: `<h2>The four conditions</h2>
        <p>Everything in this document reduces to four conditions. (1) <strong>It holds things, and it is where they live.</strong> (2) <strong>The organising layer is separate from the raw content.</strong> (3) <strong>It promises preservation, retrieval, and a boundary.</strong> (4) <strong>It is the original, not a copy.</strong></p>
        <p>Drop any one and you get a recognisable near-miss: a bare box, a loose folder, a cache, a mirror. Each of the four is necessary. Together they are sufficient. That is the claim the whole document exists to defend.</p>`,
    6: `<h2>Layers</h2>
        <p>Every working repository has three layers. The raw content — the bytes. The inflated layer — everything added to organise those bytes: names, indices, manifests. And the deflated descriptor — the small thing that points back at the raw content.</p>
        <p>Keep those three apart and you can always tell what is original and what is commentary about the original.</p>`,
    7: `<h2>Security</h2>
        <p>Eight layers, from the wire to isolation. Each layer stops a specific failure. A lock that stops nothing is decoration, so each layer here names the failure it stops and how it stops it.</p>
        <p>The workshop also refuses to ship what it cannot verify: no signing key, no build; an unaligned package is never handed to the signer.</p>`,
    8: `<h2>Composition</h2>
        <p>Each specification breaks into a counted list of parts. Counting matters: a list that does not end in a number is a list that can quietly grow or shrink. Every enumeration in this document terminates in a count and a rule for membership.</p>`,
    9: `<h2>Closure</h2>
        <p>A document that cannot be wrong is not a claim, it is a mood. This one names four ways it could be wrong, and it names the test that would show it. It also states plainly what is new here: the synthesis, not the components.</p>`,
    10: `<h2>Conclusion</h2>
        <p>The manufactory names one invariant across eleven engines and eight specifications. The four conditions are a checklist you can carry away: hold, separate, promise, originate. Drop one and you can name what you have instead.</p>
        <p>The phone builds. The hand derives. The machine executes. The equation closes at zero, or the build does not ship.</p>`,
  },
  paper: {
    0: `<p class="kicker">Abstract</p>
        <p>This document specifies <em>Darkith Omega</em>, an on-device software manufactory that compiles, packages, aligns, and signs an Android application entirely on a 4 GB arm64 telephone under Termux, with no Gradle, no cloud, and no build daemon. The system is described as a closed circuit: eleven engines, eight repository specifications, and four necessary-and-jointly-sufficient conditions. The toolchain is the seven-step raw chain (aapt2, kotlinc, d8, zip, zipalign, apksigner). The repair loop is a residual criterion, capital-sigma equals zero, in which a build ships only when the substrate residual and the bytecode residual are both zero. The governance layer is a set of 24 executable gates run by a single command. Every enumeration below is closed by an explicit count and a membership rule; the novelty boundary and four falsification conditions are stated in section 9.</p>
        <p>Version of record: <code>2.1.0-omega</code> (versionCode 4). Package <code>com.darkith.transliaison</code>. Repository <code>Deobfugazi/darkith-forge</code>.</p>`,
    1: `<h2>1. Introduction</h2>
        <p>The system is presented as a manufactory in the etymological sense: a place where hand-derivation and machine-execution are joined, not a factory where execution is opaque. Three claims and one non-claim.</p>
        <p><strong>Claims.</strong> (1) The eleven engines are re-instantiations of one functional invariant, not independent mechanisms. (2) The eight repository specifications are distinct instantiations of that invariant at different layers, not rival definitions. (3) The invariant decomposes into four conditions, each individually necessary and the four jointly sufficient for the system to be a manufactory rather than a build script.</p>
        <p><strong>Non-claim.</strong> The invariant is not newly discovered. Its components are public. The synthesis, and the forcing of every leg into an executable gate, is the contribution.</p>
        <p><strong>Closure discipline.</strong> Every enumeration terminates in a count and a membership rule. Every substantive assertion is marked <em>resolved</em> (the derivation is carried here), <em>exposable</em> (the mechanism is established in a cited artifact but not quoted verbatim), or <em>inferred</em> (the author's synthesis). Section 9 states the four conditions under which this document is wrong.</p>`,
    2: `<h2>2. Etymology and the root sense</h2>
        <p>Latin <em>manufactorium</em>, from <em>manus</em> (hand) and <em>facere</em> (to make): a place where something is made by hand. The root sense is hand-making, not mass production. The prototype of the invariant is already present in the root: a making-place where the agent's hand and the instrument are joined, and where the instrument does not conceal the stroke.</p>
        <p>The distinction is load-bearing, not decorative. A factory's defining property is that the making is mediated by machinery the maker does not inspect. A manufactory's defining property is the opposite: the hand derives the invariant and the machine executes it, and the execution remains inspectable. Darkith Omega is a manufactory under this definition because every transformation is a named step with a forced output and a named residual, and because no step is permitted to succeed silently.</p>`,
    3: `<h2>3. Synchrony: the eleven engines</h2>
        <p>Membership rule: an engine is admitted if it performs a transformation that no other admitted engine performs, and if its failure mode is distinguishable from every other engine's failure mode.</p>
        <table>
          <tr><th>ID</th><th>Engine</th><th>Transformation</th><th>Core</th></tr>
          <tr><td>E1</td><td><code>TransliaisonEngine</code></td><td>Parses HTML into <code>LayoutNode</code> IR</td><td>A, B</td></tr>
          <tr><td>E2</td><td><code>EntryPointRewriter</code></td><td>Rewrites entry points in the emitted tree</td><td>B, C</td></tr>
          <tr><td>E3</td><td><code>AxmlWriter</code></td><td>Emits binary Android XML</td><td>B</td></tr>
          <tr><td>E4</td><td><code>DarkithSolidityCompiler</code></td><td>Compiles source to bytecode</td><td>C</td></tr>
          <tr><td>E5</td><td><code>SubstrateIngestor</code></td><td>Extracts a missing symbol and verifies it</td><td>C, D</td></tr>
          <tr><td>E6</td><td><code>DarkithRuntimeHost</code></td><td>Hosts the runtime the code executes in</td><td>A, C</td></tr>
          <tr><td>E7</td><td><code>DarkithAlpineGuest</code></td><td>Provides the guest userspace</td><td>A</td></tr>
          <tr><td>E8</td><td><code>DarkithContentStore</code></td><td>Stores content by address</td><td>A, B, D</td></tr>
          <tr><td>E9</td><td><code>DarkithEVMKit</code></td><td>Executes the bytecode machine</td><td>C</td></tr>
          <tr><td>E10</td><td><code>MemoryGovernor</code></td><td>Bounds resident memory per job</td><td>C</td></tr>
          <tr><td>E11</td><td><code>AutophagicAllocator</code></td><td>Reclaims and recycles allocations</td><td>C, D</td></tr>
        </table>
        <p><strong>Count: 11.</strong> The invariant is not that these are eleven things but that each is a stage of one circuit: parse, rewrite, emit, compile, ingest, host, execute, store, bound, reclaim. No stage can be removed without a named stage failing to receive its input, and no two stages accept the same input and produce the same output.</p>
        <p>The memory pair deserves emphasis on a 4 GB device: <code>MemoryGovernor</code> bounds the ceiling and <code>AutophagicAllocator</code> returns what is no longer needed. They are separate engines because bounding and reclaiming fail differently — a bound that is too high dies of OOM, a reclaim that never runs dies of fragmentation. One engine cannot report both failures.</p>`,
    4: `<h2>4. The eight specifications</h2>
        <p>Membership rule: a specification is admitted if it is a distinct instantiation of the invariant with a distinguishable organising apparatus. A specification that is merely a storage layer of another is not admitted as a rival; it is recorded as a layer.</p>
        <table>
          <tr><th>ID</th><th>Specification</th><th>Apparatus</th><th>Core</th></tr>
          <tr><td>T1</td><td>Version-control repository</td><td>Object store + refs + history graph</td><td>A, B, C, D</td></tr>
          <tr><td>T2</td><td>Package repository</td><td>Index + dependency solver + signatures</td><td>A, B, C, D</td></tr>
          <tr><td>T3</td><td>Container / OCI registry</td><td>Manifest + layer digests + tags</td><td>A, B, C, D</td></tr>
          <tr><td>T4</td><td>Repository Pattern (DDD)</td><td>Domain interface over a persistence store</td><td>B, C</td></tr>
          <tr><td>T5</td><td>Institutional archive</td><td>Catalogue + custody + preservation policy</td><td>A, C, D</td></tr>
          <tr><td>T6</td><td>Content-addressed store</td><td>Digest as address, no mutable names</td><td>A, B, D</td></tr>
          <tr><td>T7</td><td>Build cache</td><td>Keyed artifacts + invalidation rule</td><td>B, C</td></tr>
          <tr><td>T8</td><td>Release channel</td><td>Versioned artifacts + admission policy</td><td>A, C, D</td></tr>
        </table>
        <p><strong>Count: 8.</strong> T7 (build cache) is the storage-layer specification of T1, not a rival definition: a cache is a version-control store with its history discarded. It is admitted separately because its <em>promise</em> differs — a cache promises speed, not permanence — and the promise is part of Core C. This is the same distinction the source paper makes between a specification and a layer, applied to the manufactory.</p>`,
    5: `<h2>5. Structure: the four conditions</h2>
        <p>The invariant decomposes into four conditions.</p>
        <table>
          <tr><th>ID</th><th>Name</th><th>Requires</th><th>Failure mode if absent</th></tr>
          <tr><td>A</td><td>Relational</td><td>Authoritative holding environment; persistence; access mediation</td><td>Bare container</td></tr>
          <tr><td>B</td><td>Structural</td><td>Organising apparatus separate from raw content</td><td>Loose folder</td></tr>
          <tr><td>C</td><td>Functional</td><td>Preservation contract; retrieval mechanism; purpose boundary</td><td>Cache</td></tr>
          <tr><td>D</td><td>Authority</td><td>Server of record; not a derived copy</td><td>Mirror</td></tr>
        </table>
        <p><strong>Necessity.</strong> Remove any one and the result is a recognisable near-miss rather than a manufactory. Without A the output is a scratch directory: things are held, but nothing is where they <em>live</em>. Without B the raw bytes and the commentary about them are indistinguishable, so no step can be verified against its own output. Without C there is no promise, so a successful build today is no evidence about tomorrow. Without D the artifact is a copy of something else's record, so the signature attests to a derivation rather than to an original.</p>
        <p><strong>Sufficiency.</strong> The conjunction A and B and C and D is sufficient: an authoritative, bounded, persistent holding environment whose apparatus is separate from its raw content and which mediates access through a preservation-and-retrieval logic is, by construction, a manufactory. Nothing further is required to distinguish it from the near-misses, because each near-miss is exactly one absent conjunct.</p>
        <p><strong>The independence argument.</strong> C does not entail A: a cache satisfies the functional condition (it preserves and retrieves for a purpose) while failing the relational one (it is not where the artifact lives). A does not entail C: a scratch directory satisfies the relational condition while promising nothing. Because neither entails the other, the conditions are independent, and the conjunction is not redundant. This is the load-bearing argument of the section, and it is the one that would fall first if the paper were wrong.</p>`,
    6: `<h2>6. Information layers</h2>
        <p>Three layers, closed.</p>
        <ul>
          <li><strong>R — Raw.</strong> The bytes themselves: source, resources, the compiled artifact.</li>
          <li><strong>I — Inflated.</strong> Everything added to organise R: names, indices, manifests, the task board, the gate outputs.</li>
          <li><strong>&Delta; — Deflated.</strong> The small descriptor that points back at R: a digest, a commit id, a version string.</li>
        </ul>
        <p>In this repository the three layers are literal. R is the tracked tree (299 files). I is the index layer: <code>docs/INDEX.md</code>, <code>docs/kb_manifest.json</code>, <code>TASKS.md</code>. &Delta; is the version of record, <code>2.1.0-omega</code>, and the per-artifact sha256 digests in <code>proof/</code>. The separation is enforced, not merely described: a gate (<code>kb_index</code>) fails if a readable file is unfiled, and a gate (<code>doc_path</code>) fails if a document cites a path that does not resolve.</p>`,
    7: `<h2>7. Security</h2>
        <p>Eight layers, each naming the failure it stops.</p>
        <table>
          <tr><th>#</th><th>Layer</th><th>Stops</th></tr>
          <tr><td>1</td><td>Transport</td><td>Interception in flight</td></tr>
          <tr><td>2</td><td>Secret hygiene</td><td>A key committed to the tree (<code>secret_gate</code>)</td></tr>
          <tr><td>3</td><td>Reference integrity</td><td>Compiling against a symbol the runtime lacks (<code>dex_link</code>)</td></tr>
          <tr><td>4</td><td>Alignment</td><td>An unaligned artifact reaching the signer (forced chain step 6)</td></tr>
          <tr><td>5</td><td>Signature</td><td>A tampered or unsigned package (<code>apksigner</code>, v2)</td></tr>
          <tr><td>6</td><td>Append-only record</td><td>History rewrite of a decision (<code>nodal</code> triggers)</td></tr>
          <tr><td>7</td><td>Bounded memory</td><td>Unbounded resident growth on a 4 GB device (<code>MemoryGovernor</code>)</td></tr>
          <tr><td>8</td><td>Isolation</td><td>Guest code reaching host state it does not own (<code>DarkithAlpineGuest</code>)</td></tr>
        </table>
        <p><strong>Count: 8.</strong> The closure property is that every layer names a failure and a mechanism. A layer that names a failure but no mechanism is a wish; a mechanism that names no failure is decoration. Both are rejected.</p>
        <p>The forced ordering in layer 4 and 5 is the sharpest instance: signing an unaligned package and then aligning it invalidates the signature. The order is therefore not a preference. The signer's input is the aligned file; the unsigned file is never signed. <code>build.sh</code> enforces this and there is no fallback.</p>`,
    8: `<h2>8. Composition</h2>
        <p>Each specification decomposes into a counted list. Counts are of the <em>observed</em> tree, not of an intention.</p>
        <table>
          <tr><th>Component</th><th>Count</th><th>Where</th></tr>
          <tr><td>Tracked files</td><td>299</td><td><code>git ls-files</code></td></tr>
          <tr><td>Kotlin sources</td><td>63</td><td><code>*.kt</code></td></tr>
          <tr><td>Python tools</td><td>44</td><td><code>tools/*.py</code></td></tr>
          <tr><td>Shell tools</td><td>12</td><td><code>tools/*.sh</code></td></tr>
          <tr><td>Executable gates</td><td>24</td><td><code>tools/*_gate.py</code></td></tr>
          <tr><td>CI circuit steps</td><td>51</td><td><code>run "..."</code> in <code>tools/ci.sh</code></td></tr>

        <p><strong>Count: 11 rows.</strong> The 12 noveltreatises are carried in 9 files because the first four share one protocol document; the count of treatises is 12, the count of files is 9, and both numbers are true because they count different things. This is the same distinction the source paper draws between senses and their transmission forms.</p>`,
    9: `<h2>9. Closure</h2>
        <p><strong>Novelty boundary.</strong> Component-novel, not component-invented. The seven-step chain is public Android tooling. The residual criterion is the closure discipline the noveltreatise corpus states. What is new is the forcing: each leg is an executable gate, and the build does not ship when a leg is not derived.</p>
        <p><strong>Four falsification conditions.</strong></p>
        <ul>
          <li><strong>F1.</strong> An admitted engine that satisfies no core, or that duplicates another engine's transformation.</li>
          <li><strong>F2.</strong> A specification admitted that fails condition B — no separable apparatus — yet is called a manufactory stage.</li>

        </ul>
        <p>Each falsifier is testable. F1 and F2 are tested by the count-and-membership discipline above: an admitted engine with no distinct transformation breaks the count. F3 is tested by the independence argument in section 5. F4 is tested by search, and remains open in the sense that no search is exhaustive.</p>`,
    10: `<h2>10. Conclusion</h2>

/* ============================================================
   3. ROUTER — hash based, per-register deep links.
   #/home          — front matter (landing, with bookmarks)
   #/plain/N       — section N, plain register
   #/paper/N       — section N, paper register
   #/machine/N     — section N, machine register
   #/provenance/N  — section N, provenance register
   ============================================================ */
const view = document.getElementById("view");
const toc = document.getElementById("toc");
const scrim = document.getElementById("scrim");
const VALID = ["plain", "paper", "machine", "provenance"];

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [vol, sid] = h.split("/");
  if (!vol || vol === "home") return { vol: "home", id: 0 };
  if (!VALID.includes(vol)) return { vol: "home", id: 0 };
  const raw = Number(sid);
  // Clamp into range: a stale or hand-typed deep link must never throw.
  const id = Number.isFinite(raw) ? Math.min(Math.max(Math.trunc(raw), 0), SECTIONS.length - 1) : 0;
  return { vol, id };
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render() {
  const { vol, id } = parseHash();

  if (vol === "home") {
    view.innerHTML = `
      <p class="kicker">An invariant decomposition of a manufactory</p>
      <h1>Darkith Omega</h1>
      <p class="lede">The mechanistic repositorial manufactory circuit tree. A unit in four registers. Each bookmark is a direct link — experts can skip the beginner volume entirely.</p>
      <div class="bookmarks">
        <a class="bookmark" href="#/plain/0">
          <span class="tag">01 · PLAIN</span>
          <strong>Start here</strong>
          <span>No prior knowledge assumed. Ordinary words, a phone that builds itself.</span>
        </a>
        <a class="bookmark" href="#/paper/0">
          <span class="tag">02 · PAPER</span>
          <strong>Expert volume</strong>
          <span>The full argument: eleven engines, eight specifications, four conditions.</span>
        </a>
        <a class="bookmark" href="#/machine/0">
          <span class="tag">03 · MACHINE</span>
          <strong>Machine register</strong>
          <span>Structured YAML. Every entity, condition, count and path as a field.</span>
        </a>
        <a class="bookmark" href="#/provenance/0">
          <span class="tag">04 · PROVENANCE</span>
          <strong>Layer 2 projected</strong>
          <span>Per-claim record. Who asserted, who verified, what referent, what status.</span>
        </a>
      </div>
      <hr>
      <p style="font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)">
        Keyboard: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> page &middot; <kbd>t</kbd> contents &middot; <kbd>d</kbd> theme
      </p>
      <footer class="shell">Darkith Forge — the reader shell for <code>docs/DARKITH-OMEGA-README.html</code>. Version of record <code>2.1.0-omega</code>.</footer>`;
    document.querySelectorAll("#bar .vol").forEach((a) => a.removeAttribute("aria-current"));
    return;
  }

  const sec = SECTIONS[id];
  const body = (CONTENT[vol] && CONTENT[vol][id]) || "<p>Content not yet loaded for this register.</p>";
  const isMachine = vol === "machine" || vol === "provenance";

  // Provenance spine: the per-claim record, projected inline into the reader
  // (except in the provenance register itself, which already is that record).
  const prov = CONTENT.provenance[id];
  const provBlock = (vol !== "provenance" && prov)
    ? `<details class="provenance"><summary>Provenance</summary><pre><code>${escapeHtml(prov)}</code></pre></details>`
    : "";

  view.innerHTML = `
    <p class="kicker">${escapeHtml(vol).toUpperCase()} &middot; ${String(id).padStart(2, "0")} / ${SECTIONS.length - 1}</p>
    <h1>${escapeHtml(sec.title)}</h1>
    ${isMachine ? `<pre><code>${escapeHtml(body)}</code></pre>` : body}
    ${provBlock}
    <nav id="pager">
      ${id > 0 ? `<a href="#/${vol}/${id - 1}">&larr; ${escapeHtml(SECTIONS[id - 1].title)}</a>` : `<a href="#/home">&larr; Front matter</a>`}
      ${id < SECTIONS.length - 1 ? `<a href="#/${vol}/${id + 1}">${escapeHtml(SECTIONS[id + 1].title)} &rarr;</a>` : `<a href="#/home">Back to start &rarr;</a>`}
    </nav>`;

  document.querySelectorAll("#bar .vol").forEach((a) =>
    a.setAttribute("aria-current", String(a.dataset.vol === vol))
  );

  try { localStorage.setItem("repo-reader-pos", JSON.stringify({ vol, id })); } catch (e) {}
  buildToc(vol, id);
  view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function buildToc(vol, current) {
  toc.innerHTML =
    `<div class="volhead">${escapeHtml(vol)} register</div>` +
    SECTIONS.map((s) =>
      `<a href="#/${vol}/${s.id}" ${s.id === current ? 'aria-current="true"' : ""}>${String(s.id).padStart(2, "0")} &middot; ${escapeHtml(s.title)}</a>`
    ).join("") +
    `<div class="volhead">Switch register</div>` +
    VALID.filter((v) => v !== vol)
      .map((v) => `<a href="#/${v}/${current}">${v}</a>`)
      .join("") +
    `<a href="#/home" style="margin-top:.8rem">&crarr; Front matter</a>`;
}

/* ============================================================
   4. CONTROLS
   ============================================================ */
document.getElementById("menu").onclick = () => {
  toc.classList.add("open");
  scrim.classList.add("on");
};
scrim.onclick = () => {
  toc.classList.remove("open");
  scrim.classList.remove("on");
};

document.getElementById("theme").onclick = () => {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  try { localStorage.setItem("repo-theme", next); } catch (e) {}
};
try { document.body.dataset.theme = localStorage.getItem("repo-theme") || "light"; } catch (e) {}

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  const { vol, id } = parseHash();
  if (vol === "home") return;
  if (e.key === "ArrowRight" && id < SECTIONS.length - 1) location.hash = `#/${vol}/${id + 1}`;
  if (e.key === "ArrowLeft") location.hash = id > 0 ? `#/${vol}/${id - 1}` : "#/home";
  if (e.key === "t") document.getElementById("menu").click();
  if (e.key === "d") document.getElementById("theme").click();
});

window.addEventListener("hashchange", render);

/* resume prompt */
(function resume() {
  try {
    const saved = JSON.parse(localStorage.getItem("repo-reader-pos") || "null");
    if (saved && VALID.includes(saved.vol) && Number.isFinite(saved.id) && location.hash === "") {
      setTimeout(() => {
        if (confirm(`Resume where you left off — ${saved.vol} register, section ${saved.id}?`)) {
          location.hash = `#/${saved.vol}/${saved.id}`;
        }
      }, 60);
    }
  } catch (e) {}
})();

render();
</script>
</body>
</html>
