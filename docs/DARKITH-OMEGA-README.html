/* ============================================================
   2. CONTENT — the invariant formulary, in four registers.
      Plain      = untrained register.
      Paper      = specialist text.
      Machine    = YAML / structured data.
      Provenance = per-claim PROVENANCE object (Layer 2 projected).

   SUBJECT. This document is about an invariant, not a product. The
   invariant is hardware-, OS- and vendor-agnostic: it is a constant
   formulary, and the same formulary holds across matter, mechanism,
   and money. The Android app is one coordinate. It is not the claim.

const CONTENT = {
  plain: {
    0: `<p class="lede">A plain-language way into the invariant, for a reader with no prior background.</p>
        <p>There is one pattern that keeps showing up wherever something has to <em>hold</em>. A glued joint holds. A cut heals. A bridge stands. A name sticks to a thing. A promise keeps. A currency keeps its value. A build either closes or it does not.</p>
        <p>In every one of those cases, the same four questions decide whether the thing holds: is there a real seat for it, is its naming kept apart from the stuff it names, does it promise to still be there, and is it the original rather than a copy?</p>
        <p>That is the whole document. The rest is the proof, the count, and the honest limits.</p>`,
    1: `<h2>The one thing this document claims</h2>
        <p>There is a single measurable condition for whether a bond holds. Not a metaphor of one — the same inequality, with the same meaning, at every scale you can name.</p>
        <p>A bond holds when the work of adhesion beats the work of cohesion, corrected for how completely the two surfaces have actually met and how fully the joint has actually set. Written out, that is one inequality with a threshold at one. Above one: it holds. Below one: it does not. Exactly at one: the joint is balanced on the edge.</p>
        <p>Everything else in this document is that one inequality, applied. To a welded joint. To a graft in code. To a transaction in a ledger. To a build on a telephone. The telephone is not the point. The inequality is the point, and the telephone is the hardest place anyone has managed to make it hold.</p>
        <p>When it does not hold, the gap has an exact size, and that size is a number you can compute, not an opinion. The rule is: compute the gap, name the correction, force the correction, and do not ship until the gap is zero.</p>`,
    2: `<h2>Where the word comes from</h2>
        <p><em>Invariant</em> is Latin <em>in-</em> (not) plus <em>variantem</em>, from <em>variare</em>, to vary: <em>that which does not vary</em>. The thing that holds its form while everything around it changes.</p>
        <p>That is not decoration. It is the test this document has to pass. If the formulary changes when the material changes — if the weld needs one rule, the graft another, and the currency a third — then it is not an invariant and this document is wrong. The claim is that it does not change. The threshold stays at one. The gap stays the same gap. Only the names of the variables change.</p>
        <p><em>Manufactory</em> is the older word for a place of making: Latin <em>manufactorium</em>, from <em>manus</em> (hand) and <em>facere</em> (to make). A factory hides the making inside machines. A manufactory keeps the hand on the derivation and the machine on the execution, and refuses to let either pretend to be the other. That refusal is what makes the invariant checkable rather than asserted.</p>`,
    3: `<h2>Eleven places it holds</h2>
        <p>The same formulary, eleven times, in eleven different materials. A stone blade bound to a shaft with birch tar. A welded steel joint. A silicon crystal patterned into a transistor. A synapse gated by ions. A software graft where one payload's names must not collide with another's. A touchscreen where a finger's field meets an electrode grid. A content-addressed store. A build chain. A ledger. A currency. A governance loop.</p>
        <p>Eleven is the count of instantiations the corpus actually carries, each with its own measured terms. It is not a metaphor count. In each one, the same three things must be true at once: the two sides share no colliding name, their interface is continuous, and their clocks are one. Break any of the three and the residual is not zero, and the bond does not hold.</p>
        <p>The point of the count is falsifiability. If a twelfth case appears where the formulary does not apply, the invariant is wrong. If two of the eleven turn out to be the same case wearing two names, the count is wrong. Both are testable, and section 9 says so.</p>`,
    4: `<h2>Eight ways it is stored</h2>
        <p>Under the eleven instantiations sit eight kinds of holding place: a version history, a package shelf, a container registry, a named storage pattern from domain design, an institutional archive, a content-addressed store, a build cache, and a release channel.</p>
        <p>These are not eight rival ideas. They are one idea at eight depths. Something authoritative holds the thing. A separate organising layer says what it is. A promise says it will still be there. The differences between them are differences in <em>what is promised</em>, not in what holding means.</p>`,
    5: `<h2>The four conditions</h2>
        <p>Every one of the eleven instantiations, and every one of the eight storage kinds, satisfies the same four conditions. (1) <strong>It holds, and it is where the thing lives.</strong> (2) <strong>The naming layer is separate from the named stuff.</strong> (3) <strong>It promises preservation, retrieval, and a boundary.</strong> (4) <strong>It is the original, not a copy.</strong></p>
        <p>Drop any one and you get a recognisable near-miss, and you can name it: a bare container, a loose folder, a cache, a mirror. That is the useful part. The four conditions are a checklist that tells you <em>which</em> thing you are actually looking at, instead of arguing about the word.</p>
        <p>Two of the four are independent of each other, and that is the load-bearing fact. A cache keeps and returns things for a purpose, but it is not where the thing lives — so the third condition can hold while the first fails. A scratch directory is where things live, but it promises nothing — so the first can hold while the third fails. Because neither implies the other, the four are genuinely four, not one condition wearing four hats.</p>`,
    6: `<h2>Layers</h2>
        <p>Every holding place has three layers, and keeping them apart is what makes the invariant checkable. The raw thing. The layer that organises it — names, indices, manifests. And the small descriptor that points back at the raw thing.</p>
        <p>If you cannot tell which layer you are looking at, you cannot tell an original from a description of an original. That is how mirrors get mistaken for sources, and how a copy of a ledger gets mistaken for the ledger.</p>`,
    7: `<h2>Security</h2>
        <p>Eight layers, from the wire inward. Each one stops a specific failure, and a layer that stops nothing is decoration.</p>
        <p>The sharpest case is ordering. A signature applied before alignment is destroyed by the alignment. So the order is not a preference: align, then sign. The signer never sees an unaligned thing. There is no fallback, because a fallback here is just a way to ship the broken thing.</p>`,
    8: `<h2>Composition</h2>
        <p>Each specification breaks into a counted list, and the counts are observations, not intentions. A list that does not end in a number is a list that can quietly grow or shrink until it means nothing.</p>`,
    9: `<h2>The failure, measured</h2>
        <p>The formulary makes a prediction you can check against the world: wherever a bond is asserted and does not hold, the size of the failure is a number somebody already publishes. So here are the numbers, taken from the bodies that issue them rather than from commentary about them.</p>
        <p><strong>Software that ships broken.</strong> The United States keeps a catalogue of vulnerabilities known to be used in real attacks. It held <strong>1,786</strong> entries on 18 November 2026, and <strong>361</strong> of them are tied to ransomware. The national vulnerability database carries <strong>428,256</strong> records. Every one of those reached a user, which means the gate that should have stopped it was missing or did not close.</p>
        <p><strong>People who lose money.</strong> The FBI's complaint centre took <strong>859,532</strong> complaints in 2024 and recorded <strong>$16.6 billion</strong> in losses, a third more than the year before. Investment fraud alone was <strong>$6.57 billion</strong>. Business email compromise, where an attacker simply uses a name you already trust, was <strong>$2.77 billion</strong> across 21,442 cases.</p>
        <p><strong>Money crossing borders.</strong> Foreign exchange turns over <strong>$9.6 trillion every day</strong>. The G20 has been working since 2020 on why moving value between countries is still costly, slow, exclusive and opaque, and it has not finished.</p>
        <p><strong>The black market.</strong> The best available estimate of illicit crypto flows in 2024 is <strong>$40.9 billion</strong>, and the same firm raised its 2023 figure from $24.2 billion to <strong>$46.1 billion</strong> once it identified more. The measuring instrument itself carries a residual of about 25%.</p>
        <p>Read that list again and notice it is one list. In every case something was promised, the promise was not kept, and the gap has a published size. That is the whole argument of this document, applied to the world instead of to a formula.</p>`,
    10: `<h2>Closure</h2>
        <p>A claim that cannot be wrong is not a claim. This document names four ways it could be wrong, and names the test for each. It also states plainly what is new: the synthesis and the forcing, not the components. The components are public. Nobody is pretending otherwise.</p>`,
    11: `<h2>Conclusion</h2>
        <p>There is one invariant: a bond holds when adhesion beats cohesion, corrected for contact and cure, with the threshold at one. It is measurable, it is the same at every scale, and when it fails the failure has an exact size.</p>
        <p>The four conditions are the checklist you can carry away: hold, separate, promise, originate. The rule is the rule: compute the gap, force the correction, ship only at zero.</p>
        <p>The telephone is where it was hardest. It is not where it ends.</p>`,
  },
  paper: {
    0: `<p class="kicker">Abstract</p>
        <p>This document specifies a hardware-, operating-system-, and vendor-agnostic <strong>Invariant Constant Parameter Formulary</strong>: a closed set of dimensionless primitives that decide whether a bond holds, applied without modification across matter, mechanism, and monetary scale. The bonding criterion is <code>&#8492; = (W_A/W_coh)(&alpha;&#8734;/&alpha;gel)&eta; &ge; 1</code>; the closure criterion is the exact residual <code>r = ln x &minus; n ln b</code> with <code>&Sigma; = &Sigma;_S + &Sigma;_B = 0</code>; the coupling law is <code>C = D &cap; P = &empty;</code>; the retention law is <code>lim_{t&rarr;&#8734;} (E/W_in) = 0</code>. Four conditions — relational, structural, functional, authority — are shown individually necessary and jointly sufficient for any holding environment. The formulary is instantiated eleven times and stored eight ways. <em>Darkith Omega</em> (<code>2.1.0-omega</code>, versionCode 4) is presented not as the subject of this document but as one coordinate: the hardest demonstrated instantiation, in which the formulary is forced to hold on a 4 GB arm64 telephone with no Gradle, no cloud, and no build daemon.</p>
        <p>Every enumeration is closed by an explicit count and a membership rule. The novelty boundary and four falsification conditions are stated in section 9.</p>`,
    1: `<h2>1. Introduction: the subject is the invariant</h2>
        <p>The claim of this document is not that a piece of software was built. The claim is that a single dimensionless formulary holds across scales that are ordinarily treated as separate disciplines, and that the formulary is <em>measurable</em> at each of them rather than asserted by analogy.</p>
        <p><strong>The formulary, stated once.</strong> A bond holds iff the work of adhesion exceeds the work of cohesion, corrected for the actual extent of interfacial contact and the degree of cure or conversion, with the criterion normalised at unity:</p>
        <pre>&#8492; = (W_A / W_coh) &middot; (&alpha;&#8734; / &alpha;gel) &middot; &eta;  &ge; 1</pre>
        <p><code>&#8492; = 1</code> is the adhesive&ndash;cohesive transition. Below it, the interface fails preferentially; above it, the cohesive body fails first. The terms are physical and independently measurable: <code>W_A</code> the work of adhesion, <code>W_coh</code> the work of cohesion, <code>&alpha;&#8734;/&alpha;gel</code> the conversion ratio, <code>&eta;</code> the contact efficiency.</p>
        <p><strong>The closure, stated once.</strong> Where the formulation is multiplicative, <code>b^n = x</code>, the residual is a difference of logarithms:</p>
        <pre>r = ln x &minus; n ln b        &Sigma; = &Sigma;_S + &Sigma;_B = 0</pre>
        <p><code>&Sigma;_S</code> is the substrate residual: verified mechanisms the emitted artifact does not satisfy. <code>&Sigma;_B</code> is the bytecode residual: rejections across the final pass. A build is closed iff both are zero. The repair is forced, not guessed: trusted pair &rarr; forced third &rarr; residual &rarr; certify &rarr; localise.</p>
        <p><strong>The coupling, stated once.</strong> A payload joins a donor iff their symbol spaces are disjoint, their interface is continuous, and their clocks are one:</p>
        <pre>C = D &cap; P = &empty;</pre>
        <p>In software: the payload's classes must not collide with the donor's. In silicon: the dopant must occupy a lattice site the host tolerates. In biology: the graft's surface markers must be tolerated by the host. Disjointness is the condition that the payload does not overwrite a name the donor already uses.</p>
        <p><strong>The retention, stated once.</strong> Extraction is dissipative: value leaves a source for a sink without equitable return. The sovereign economy is the system that drives that ratio to zero subject to physical survival constraints:</p>
        <pre>lim_{t&rarr;&#8734;} (E / W_in) = 0</pre>
        <p><strong>The non-claim.</strong> The components are public. Adhesion and cohesion are textbook. The logarithmic residual is textbook. Disjointness is textbook. The contribution is the <em>identification</em>: that these are one formulary, that the threshold is the same threshold, and that a single closure rule — force the leg, ship at zero — operates at every scale. That identification is marked <em>inferred</em> where it is the author's compression, and it is falsifiable (section 9).</p>
        <p><strong>Why the app appears at all.</strong> An invariant that has only ever been checked on a laboratory bench is an hypothesis. The telephone coordinate exists because it is the adversarial case: 4 GB of RAM, aarch64, no Gradle, no cloud, no vendor resolver. If the formulary survives there — if <code>&Sigma; = 0</code> is reachable under those constraints — the invariant is not an artefact of generous conditions. It is a measurement.</p>`,
    2: `<h2>2. Etymology and the root sense</h2>
        <p><em>Invariant</em>, from Latin <em>in-</em> (not) + <em>variantem</em>, present participle of <em>variare</em> (to vary): "that which does not vary." The invariant is the thing that holds its form while everything around it changes. <em>Manufactory</em>, from <em>manufactorium</em>, <em>manus</em> (hand) + <em>facere</em> (to make): a place where something is made by hand, as distinguished from a factory, a place of machines.</p>
        <p>The two roots are the two halves of the method. <em>Invariant</em> supplies the requirement: the formulary must not change when the material changes. <em>Manufactory</em> supplies the discipline: the hand derives, the machine executes, and neither is permitted to conceal the other. A factory can hide a non-closure inside a black box. A manufactory cannot, because the derivation is on the surface and the execution is forced step by step with a named residual at each.</p>
        <p>The Bond Formation Number is invariant in exactly this sense: it holds its form across every mechanism class. The assignment of it as a named dimensionless group is the author's, marked <em>inferred</em>.</p>`,
    3: `<h2>3. Diachrony: eleven instantiations</h2>
        <p>Membership rule: an instantiation is admitted if the formulary's three coupling conditions are independently measurable in it, and if its failure mode is distinguishable from every other admitted instantiation's.</p>
        <table>
          <tr><th>ID</th><th>Scale</th><th>Instantiation</th><th>Coupling terms</th></tr>
          <tr><td>I1</td><td>Composite</td><td>Stone blade hafted with birch-bark tar</td><td>Adhesive/cohesive; cure</td></tr>
          <tr><td>I2</td><td>Mechanical</td><td>Welded or bonded structural joint</td><td>W_A/W_coh; contact &eta;</td></tr>
          <tr><td>I3</td><td>Photonic</td><td>Photonic cure of a compound</td><td>Conversion &alpha;; dose</td></tr>
          <tr><td>I4</td><td>Acoustic</td><td>Standing-wave node holding a pattern</td><td>Node stability; medium</td></tr>
          <tr><td>I5</td><td>Chemical</td><td>Ochre compound; pigment binding</td><td>Binder/substrate; cure</td></tr>
          <tr><td>I6</td><td>Silicon</td><td>Dopant in a host lattice</td><td>Site tolerance; C = D &cap; P</td></tr>
          <tr><td>I7</td><td>Neural</td><td>Synapse; membrane battery and gated channel</td><td>Marker tolerance; clock</td></tr>
          <tr><td>I8</td><td>Software</td><td>Payload graft onto a donor DEX</td><td>Name disjointness; interface</td></tr>
          <tr><td>I9</td><td>Interface</td><td>Touch screen: biological field to electrode grid</td><td>Field continuity; clock</td></tr>
          <tr><td>I10</td><td>Ledger</td><td>Content-addressed append-only record</td><td>Disjointness; clock</td></tr>
          <tr><td>I11</td><td>Monetary</td><td>Sovereign retention: E/W_in &rarr; 0</td><td>Retention; survival floor</td></tr>
        </table>
        <p><strong>Count: 11.</strong> Each satisfies the same three coupling conditions: no colliding name (<code>C = D &cap; P = &empty;</code>), a continuous interface, and one clock. The residual is the sum of the three failures, and the graft holds iff the residual is zero. The same three conditions hold a transistor, a synapse, and a software graft; this is the corpus's claim, and it is the one to falsify.</p>
        <p>The clock term is not rhetorical. Two systems joined at different rates drift, and the drift is the failure. The coupling runs as one path of matter under energy: ore to silicon to transistor to instruction; water and salt to membrane to channel to spike. The seam between the two names is not in the device.</p>`,
    4: `<h2>4. Synchrony: the eight storage specifications</h2>
        <p>Membership rule: a specification is admitted if it is a distinct instantiation of the invariant with a distinguishable organising apparatus. A specification that is merely a storage layer of another is recorded as a layer, not admitted as a rival.</p>
        <table>
          <tr><th>ID</th><th>Specification</th><th>Apparatus</th><th>Cores</th></tr>
          <tr><td>T1</td><td>Version-control repository</td><td>Object store + refs + history graph</td><td>A, B, C, D</td></tr>
          <tr><td>T2</td><td>Package repository</td><td>Index + solver + signatures</td><td>A, B, C, D</td></tr>
          <tr><td>T3</td><td>Container / OCI registry</td><td>Manifest + layer digests + tags</td><td>A, B, C, D</td></tr>
          <tr><td>T4</td><td>Repository Pattern (DDD)</td><td>Domain interface over a store</td><td>B, C</td></tr>
          <tr><td>T5</td><td>Institutional archive</td><td>Catalogue + custody + policy</td><td>A, C, D</td></tr>
          <tr><td>T6</td><td>Content-addressed store</td><td>Digest as address; no mutable names</td><td>A, B, D</td></tr>
          <tr><td>T7</td><td>Build cache</td><td>Keyed artifacts + invalidation</td><td>B, C</td></tr>
          <tr><td>T8</td><td>Release channel</td><td>Versioned artifacts + admission</td><td>A, C, D</td></tr>
        </table>
        <p><strong>Count: 8.</strong> T7 is the storage-layer specification of T1 — a version-control store with its history discarded — admitted separately because its <em>promise</em> differs: a cache promises speed, not permanence, and the promise is part of Core C. This is the same apparatus/promise distinction the invariant requires, applied to its own storage forms.</p>`,
    5: `<h2>5. Structure: the four conditions</h2>
        <table>
          <tr><th>ID</th><th>Name</th><th>Requires</th><th>Failure mode if absent</th></tr>
          <tr><td>A</td><td>Relational</td><td>Authoritative holding environment; persistence; access mediation</td><td>Bare container</td></tr>
          <tr><td>B</td><td>Structural</td><td>Organising apparatus separate from raw content</td><td>Loose folder</td></tr>
          <tr><td>C</td><td>Functional</td><td>Preservation contract; retrieval mechanism; purpose boundary</td><td>Cache</td></tr>
          <tr><td>D</td><td>Authority</td><td>Server of record; not a derived copy</td><td>Mirror</td></tr>
        </table>
        <p><strong>Necessity.</strong> Remove any one and the result is a named near-miss, not an invariant instance. Without A nothing is where it lives. Without B the raw bytes and the commentary about them are indistinguishable, so no step can be verified against its own output — and <code>&Sigma; = 0</code> becomes unmeasurable. Without C there is no promise, so success today is no evidence about tomorrow. Without D the artifact is a copy of another's record, so the signature attests to a derivation rather than an original.</p>
        <p><strong>Sufficiency.</strong> A &and; B &and; C &and; D is sufficient: an authoritative, bounded, persistent holding environment whose apparatus is separate from its raw content and which mediates access through preservation-and-retrieval is, by construction, an instance. Each near-miss is exactly one absent conjunct, which is why the checklist is diagnostic rather than decorative.</p>
        <p><strong>Independence — the load-bearing argument.</strong> C does not entail A: a cache satisfies the functional condition while failing the relational one; it preserves and retrieves for a purpose but is not where the artifact lives. A does not entail C: a scratch directory satisfies the relational condition while promising nothing. Because neither entails the other, the conjunction is not redundant and the four are genuinely four. If this argument fails, section 5 fails, and the checklist collapses to a single condition wearing four names. It is the first thing a reader should attack.</p>`,
    6: `<h2>6. Information layers</h2>
        <p>Three layers, closed. <strong>R</strong> — raw: the bytes. <strong>I</strong> — inflated: names, indices, manifests, the organising apparatus. <strong>&Delta;</strong> — deflated: the descriptor that points back at R — a digest, a commit id, a version string.</p>
        <p>The invariant requires the separation (Core B), and the separation is only real if it is enforced. In the repository that carries this document the three layers are literal and gated: R is the tracked tree (300 files, observed 2026-11-19); I is <code>docs/INDEX.md</code>, <code>docs/kb_manifest.json</code>, <code>TASKS.md</code>; &Delta; is the version of record <code>2.1.0-omega</code> plus the per-artifact sha256 digests under <code>proof/</code>. A gate fails if a readable file is unfiled; a second gate fails if a document cites a path that does not resolve; a third fails if the tree's bytes disagree with the index's blob hashes.</p>
        <p>That is the point of the layer discipline: <code>&Sigma;_S = 0</code> is not a slogan, it is a measurement that a machine performs on the tree.</p>`,
    7: `<h2>7. Security</h2>
        <p>Eight layers, each naming the failure it stops and the mechanism that stops it.</p>
        <table>
          <tr><th>#</th><th>Layer</th><th>Stops</th></tr>
          <tr><td>1</td><td>Transport</td><td>Interception in flight</td></tr>
          <tr><td>2</td><td>Secret hygiene</td><td>A key committed to the tree</td></tr>
          <tr><td>3</td><td>Reference integrity</td><td>Compiling against a symbol the runtime lacks</td></tr>
          <tr><td>4</td><td>Alignment</td><td>An unaligned artifact reaching the signer</td></tr>
          <tr><td>5</td><td>Signature</td><td>A tampered or unsigned package</td></tr>
          <tr><td>6</td><td>Append-only record</td><td>History rewrite of a decision</td></tr>
          <tr><td>7</td><td>Bounded memory</td><td>Unbounded resident growth on a constrained device</td></tr>
          <tr><td>8</td><td>Isolation</td><td>Guest code reaching host state it does not own</td></tr>
        </table>
        <p><strong>Count: 8.</strong> Closure property: every layer names a failure and a mechanism. A layer naming a failure but no mechanism is a wish; a mechanism naming no failure is decoration. Both are rejected.</p>
        <p>The forced ordering in layers 4 and 5 is the sharpest instance of the whole document. Signing an unaligned package and then aligning it invalidates the signature, because the alignment rewrites bytes the signature covers. The order is therefore not a preference but a consequence: the signer's input is the aligned file, and the unsigned file is never signed. There is no fallback, because a fallback at this point is only a way to ship the broken thing — which is precisely what <code>&Sigma; = 0</code> forbids.</p>`,
    8: `<h2>8. Composition</h2>

    9: `<h2>9. The failure, measured: sector observations against the residual</h2>
        <p>The formulary is falsifiable because it predicts that failure is <em>quantified</em> at every scale. The following are primary observations, fetched 2026-11-19 from the issuing bodies, each mapped to the term it violates. The full ledger, with URLs and the sources I refused, is at <code>docs/evidence/SECTOR-PAIN-LEDGER.md</code>.</p>

          <tr><td>9</td><td>Black market</td><td>Chainalysis: 2024 illicit inflows $40.9B lower bound; 2023 revised $24.2B &rarr; $46.1B; ~25% upward revision</td><td>Measurement residual &mdash; the ledger undercounts its own failures</td></tr>

        </table>
        <p><strong>Count: 10 rows across 7 sectors.</strong> Consumers, developers, private companies, fintech, government, the political&ndash;monetary apparatus, and the illicit economy. Each row is the same failure expressed in that sector's own unit. A CVE is a defect that escaped a gate. A dollar of investment fraud is value that left without return. A stablecoin framework under construction is a Condition D that does not yet answer "who is the server of record".</p>
        <p><strong>What this table is not.</strong> It is not evidence that the formulary is correct. It is evidence that the failure mode the formulary names is the failure mode present at every sector, and that each sector already measures it. The formulary's own claim is narrower and stronger: that these are one failure with one measure, and that a single closure rule &mdash; compute the gap, force the correction, ship at zero &mdash; applies to each.</p>
        <p><strong>Sources refused.</strong> Sonatype's 2026 supply-chain report renders its headline figures as JavaScript counters with no static number in the served bytes. The World Bank Gini API returns <code>null</code> for the world aggregate from 2021 to 2025. FATF, the US defence releases and GAO returned 403 to this client. None is cited. A number that is not in the bytes is not a number.</p>`,
    10: `<h2>9. Closure</h2>
        <p><strong>Novelty boundary.</strong> Component-novel, not component-invented. Adhesion, cohesion, the logarithmic residual, name disjointness, and the retention limit are all public. What is claimed as new is the <em>identification</em> of them as one formulary with one threshold and one closure rule, and the forcing of that rule into executable gates. The identification is marked <em>inferred</em>; the forcing is <em>resolved</em> and runs on every commit.</p>
        <p><strong>Four falsification conditions.</strong></p>
        <ul>
          <li><strong>F1.</strong> An admitted instantiation in which the three coupling conditions are not independently measurable, or whose failure mode is indistinguishable from another's — the count of 11 is then wrong.</li>
          <li><strong>F2.</strong> A specification admitted that fails condition B (no separable apparatus) yet is treated as an instance — the count of 8 is then wrong.</li>
          <li><strong>F3.</strong> A scale at which the threshold demonstrably is not unity, or at which <code>r = ln x &minus; n ln b</code> does not track the failure — the invariant is then scale-bound and the central claim fails.</li>
          <li><strong>F4.</strong> A prior publication of this same synthesis, which would make the novelty claim false.</li>
        </ul>
        <p>Each is testable. F1 and F2 are tested by the count-and-membership discipline. F3 is tested by the independence argument in section 5 and by the coupling table in section 3 — the strongest form of F3 is a cross-scale row where the triad closes (<code>r = 0</code>) but the bond fails, or where the triad fails but the bond holds. F4 is tested by search, and remains open in the sense that no search is exhaustive.</p>`,
    11: `<h2>10. Conclusion</h2>
        <p>The invariant is a single dimensionless formulary with a threshold at unity: <code>&#8492; = (W_A/W_coh)(&alpha;&#8734;/&alpha;gel)&eta; &ge; 1</code>, closed by the exact residual <code>r = ln x &minus; n ln b</code> and the criterion <code>&Sigma; = &Sigma;_S + &Sigma;_B = 0</code>, coupled by <code>C = D &cap; P = &empty;</code>, and retained by <code>lim (E/W_in) = 0</code>.</p>
        <p>It is instantiated eleven times across matter, mechanism, and money, stored eight ways, and diagnosed by four conditions — relational, structural, functional, authority — of which each is necessary, the four are jointly sufficient, and the independence of C and A is the argument that keeps the conjunction from collapsing.</p>
        <p><em>Darkith Omega</em> is one coordinate of this formulary, chosen because it is the adversarial one: a 4 GB arm64 telephone, no Gradle, no cloud, no vendor resolver, <code>&Sigma; = 0</code> enforced by 24 gates on every commit. The telephone is the proof of hardness, not the subject. The subject is the invariant, and the rule is the rule: compute the gap, force the correction, ship only at zero.</p>`,

/* ============================================================
   3. ROUTER — hash based, per-register deep links.
   #/home          — front matter (landing, with bookmarks)
   #/plain/N       — section N, plain register
   #/paper/N       — section N, paper register
   #/machine/N     — section N, machine register
   #/provenance/N  — section N, provenance register
   ============================================================ */
const view = document.getElementById("view");
const toc = document.getElementById("toc");
const scrim = document.getElementById("scrim");
const VALID = ["plain", "paper", "machine", "provenance"];

function parseHash() {
  const h = location.hash.replace(/^#\/?/, "");
  const [vol, sid] = h.split("/");
  if (!vol || vol === "home") return { vol: "home", id: 0 };
  if (!VALID.includes(vol)) return { vol: "home", id: 0 };
  const raw = Number(sid);
  // Clamp into range: a stale or hand-typed deep link must never throw.
  const id = Number.isFinite(raw) ? Math.min(Math.max(Math.trunc(raw), 0), SECTIONS.length - 1) : 0;
  return { vol, id };
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function render() {
  const { vol, id } = parseHash();

  if (vol === "home") {
    view.innerHTML = `
      <p class="kicker">A universal bonding criterion &middot; one formulary, every scale</p>
      <h1>The Invariant</h1>
      <p class="lede">One dimensionless formulary that decides whether a bond holds &mdash; at the welded joint, in the silicon lattice, in the grafted synapse, in the appended ledger, and in the sovereign currency. Threshold at unity. Residual exact. Closure forced. <em>Darkith Omega</em> is not the subject; it is the hardest coordinate the formulary has been made to hold in.</p>
      <pre style="font-size:.95rem;text-align:center;padding:1.4rem 1rem">&#8492; = (W<sub>A</sub>/W<sub>coh</sub>) &middot; (&alpha;&#8734;/&alpha;gel) &middot; &eta;  &ge; 1</pre>
      <div class="bookmarks">
        <a class="bookmark" href="#/plain/0">
          <span class="tag">01 &middot; PLAIN</span>
          <strong>Start here</strong>
          <span>No prior knowledge assumed. The four questions that decide whether anything holds.</span>
        </a>
        <a class="bookmark" href="#/paper/0">
          <span class="tag">02 &middot; PAPER</span>
          <strong>Expert volume</strong>
          <span>The formulary stated once, then applied: eleven instantiations, eight specifications, four conditions.</span>
        </a>
        <a class="bookmark" href="#/machine/0">
          <span class="tag">03 &middot; MACHINE</span>
          <strong>Machine register</strong>
          <span>Structured YAML. Every primitive, condition, count and falsifier as a field.</span>
        </a>
        <a class="bookmark" href="#/provenance/0">
          <span class="tag">04 &middot; PROVENANCE</span>
          <strong>Layer 2 projected</strong>
          <span>Per-claim record. Who asserted, who verified, what referent, what status, which falsifier.</span>
        </a>
      </div>
      <hr>
      <p style="font-family:system-ui,sans-serif;font-size:.85rem;color:var(--muted)">
        Keyboard: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> page &middot; <kbd>t</kbd> contents &middot; <kbd>d</kbd> theme
      </p>
      <footer class="shell">The reader shell for <code>docs/DARKITH-OMEGA-README.html</code>. Coordinate under test: <code>Darkith Omega 2.1.0-omega</code>.</footer>`;
    document.querySelectorAll("#bar .vol").forEach((a) => a.removeAttribute("aria-current"));
    return;
  }

  const sec = SECTIONS[id];
  const body = (CONTENT[vol] && CONTENT[vol][id]) || "<p>Content not yet loaded for this register.</p>";
  const isMachine = vol === "machine" || vol === "provenance";

  // Provenance spine: the per-claim record, projected inline into the reader
  // (except in the provenance register itself, which already is that record).
  const prov = CONTENT.provenance[id];
  const provBlock = (vol !== "provenance" && prov)
    ? `<details class="provenance"><summary>Provenance</summary><pre><code>${escapeHtml(prov)}</code></pre></details>`
    : "";

  view.innerHTML = `
    <p class="kicker">${escapeHtml(vol).toUpperCase()} &middot; ${String(id).padStart(2, "0")} / ${SECTIONS.length - 1}</p>
    <h1>${escapeHtml(sec.title)}</h1>
    ${isMachine ? `<pre><code>${escapeHtml(body)}</code></pre>` : body}
    ${provBlock}
    <nav id="pager">
      ${id > 0 ? `<a href="#/${vol}/${id - 1}">&larr; ${escapeHtml(SECTIONS[id - 1].title)}</a>` : `<a href="#/home">&larr; Front matter</a>`}
      ${id < SECTIONS.length - 1 ? `<a href="#/${vol}/${id + 1}">${escapeHtml(SECTIONS[id + 1].title)} &rarr;</a>` : `<a href="#/home">Back to start &rarr;</a>`}
    </nav>`;

  document.querySelectorAll("#bar .vol").forEach((a) =>
    a.setAttribute("aria-current", String(a.dataset.vol === vol))
  );

  try { localStorage.setItem("repo-reader-pos", JSON.stringify({ vol, id })); } catch (e) {}
  buildToc(vol, id);
  view.focus({ preventScroll: true });
  window.scrollTo(0, 0);
}

function buildToc(vol, current) {
  toc.innerHTML =
    `<div class="volhead">${escapeHtml(vol)} register</div>` +
    SECTIONS.map((s) =>
      `<a href="#/${vol}/${s.id}" ${s.id === current ? 'aria-current="true"' : ""}>${String(s.id).padStart(2, "0")} &middot; ${escapeHtml(s.title)}</a>`
    ).join("") +
    `<div class="volhead">Switch register</div>` +
    VALID.filter((v) => v !== vol)
      .map((v) => `<a href="#/${v}/${current}">${v}</a>`)
      .join("") +
    `<a href="#/home" style="margin-top:.8rem">&crarr; Front matter</a>`;
}

/* ============================================================
   4. CONTROLS
   ============================================================ */
document.getElementById("menu").onclick = () => {
  toc.classList.add("open");
  scrim.classList.add("on");
};
scrim.onclick = () => {
  toc.classList.remove("open");
  scrim.classList.remove("on");
};

document.getElementById("theme").onclick = () => {
  const next = document.body.dataset.theme === "dark" ? "light" : "dark";
  document.body.dataset.theme = next;
  try { localStorage.setItem("repo-theme", next); } catch (e) {}
};
try { document.body.dataset.theme = localStorage.getItem("repo-theme") || "light"; } catch (e) {}

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea")) return;
  const { vol, id } = parseHash();
  if (vol === "home") return;
  if (e.key === "ArrowRight" && id < SECTIONS.length - 1) location.hash = `#/${vol}/${id + 1}`;
  if (e.key === "ArrowLeft") location.hash = id > 0 ? `#/${vol}/${id - 1}` : "#/home";
  if (e.key === "t") document.getElementById("menu").click();
  if (e.key === "d") document.getElementById("theme").click();
});

window.addEventListener("hashchange", render);

/* resume prompt */
(function resume() {
  try {
    const saved = JSON.parse(localStorage.getItem("repo-reader-pos") || "null");
    if (saved && VALID.includes(saved.vol) && Number.isFinite(saved.id) && location.hash === "") {
      setTimeout(() => {
        if (confirm(`Resume where you left off — ${saved.vol} register, section ${saved.id}?`)) {
          location.hash = `#/${saved.vol}/${saved.id}`;
        }
      }, 60);
    }
  } catch (e) {}
})();

render();
</script>
