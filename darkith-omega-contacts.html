<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050505">
<title>DARKITH Ω — contacts</title>
<style>
  :root{--bg:#050505;--panel:#0b0d10;--panel2:#12151a;--line:#1e232b;--ink:#e8ecf1;
    --dim:#8a93a0;--faint:#5b6572;--acc:#39d3a0;--acc2:#7aa2ff;--bad:#ff5f5f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #app{display:flex;flex-direction:column;height:100%;max-width:620px;margin:0 auto}
  header{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
  #q{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:10px 12px;color:var(--ink);font-size:13.5px;outline:none}
  #q:focus{border-color:rgba(122,162,255,.5)}
  .chip{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--panel2);color:var(--dim)}
  .chip.ok{color:var(--acc);background:rgba(57,211,160,.12)}
  .chip.no{color:var(--bad);background:rgba(255,95,95,.12)}
  #list{flex:1;overflow-y:auto;padding-bottom:80px}
  .c{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid rgba(30,35,43,.55)}
  .c:active{background:var(--panel2)}
  .av{width:36px;height:36px;border-radius:50%;background:rgba(122,162,255,.16);color:var(--acc2);
    display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .info{flex:1;min-width:0}
  .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .no{font-size:11.5px;color:var(--faint);font-family:ui-monospace,monospace}
  .go{display:flex;gap:2px}
  .go button{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
    color:var(--dim);font-size:15px}
  .go button:hover{background:var(--panel2);color:var(--ink)}
  #empty{padding:44px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
  #add{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:54px;height:54px;
    border-radius:50%;background:var(--acc);color:#04120c;font-size:26px;display:grid;place-items:center;
    box-shadow:0 6px 20px rgba(0,0,0,.5);z-index:30}
  #toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,12px);background:#161a20;
    border:1px solid var(--line);padding:9px 15px;border-radius:9px;font-size:12.5px;opacity:0;
    transition:.16s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,95,95,.5);color:#ffd9d9}
</style>
</head>
<body>
<div id="app">
  <header>
    <input id="q" placeholder="Search contacts…" autocomplete="off" spellcheck="false">
    <span class="chip" id="perm">Contacts</span>
  </header>
  <div id="list"></div>
</div>
<button id="add" aria-label="Add contact">＋</button>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var W = typeof window !== "undefined" ? window : globalThis;
  var B = W.darkith || W.darkithNative || null;
  var VERSION = "1.0.0";
  var LIMIT = 1000;

  var S = { all: [], view: [], query: "", granted: false };

  function has(fn) { return !!(B && typeof B[fn] === "function"); }
  function call() {
    var a = Array.prototype.slice.call(arguments), fn = a.shift();
    if (!has(fn)) return null;
    try { return B[fn].apply(B, a); } catch (e) { return null; }
  }
  function isError(r) { return typeof r === "string" && r.indexOf("ERROR") === 0; }
  function json(r) {
    if (!r) return null;
    if (typeof r === "object") return r;
    try { return JSON.parse(String(r)); } catch (e) { return null; }
  }

  function toast(msg, bad) {
    var t = W.document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = bad ? "bad" : ""; }, 2100);
  }

  function initials(name) {
    var parts = String(name || "").trim().split(/\s+/).filter(Boolean);
    if (!parts.length) return "?";
    if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
    return (parts[0].charAt(0) + parts[parts.length - 1].charAt(0)).toUpperCase();
  }

  /** Phone-number type codes from ContactsContract.CommonDataKinds.Phone. */
  var TYPE_LABEL = { 1: "home", 2: "mobile", 3: "work", 0: "other" };
  function typeLabel(t) { return TYPE_LABEL[t] || "other"; }

  function filter(list, q) {
    var s = String(q || "").trim().toLowerCase();
    if (!s) return list.slice();
    return list.filter(function (c) {
      return String(c.name || "").toLowerCase().indexOf(s) >= 0 ||
             String(c.number || "").replace(/\s/g, "").indexOf(s.replace(/\s/g, "")) >= 0;
    });
  }

  function render() {
    var el = W.document.getElementById("list");
    if (!el) return;
    el.textContent = "";

    if (!S.granted) {
      var e = W.document.createElement("div");
      e.id = "empty";
      e.appendChild(W.document.createTextNode("Contacts access is not granted."));
      e.appendChild(W.document.createElement("br"));
      e.appendChild(W.document.createTextNode("Tap the badge to request it. Darkith will not invent contacts."));
      el.appendChild(e);
      return;
    }

    if (!S.view.length) {
      var e2 = W.document.createElement("div");
      e2.id = "empty";
      e2.textContent = S.query ? "No contact matches “" + S.query + "”." : "No contacts.";
      el.appendChild(e2);
      return;
    }

    S.view.forEach(function (c) {
      var row = W.document.createElement("div");
      row.className = "c";

      var av = W.document.createElement("div");
      av.className = "av";
      av.textContent = initials(c.name);

      var info = W.document.createElement("div");
      info.className = "info";
      var nm = W.document.createElement("div");
      nm.className = "nm";
      nm.textContent = c.name || "(no name)";   // textContent: never inject
      var no = W.document.createElement("div");
      no.className = "no";
      no.textContent = (c.number || "") + (c.type != null ? " · " + typeLabel(c.type) : "");
      info.appendChild(nm); info.appendChild(no);

      var go = W.document.createElement("div");
      go.className = "go";
      var callBtn = W.document.createElement("button");
      callBtn.textContent = "✆";
      callBtn.title = "Call";
      callBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var r = call("dialNumber", c.number);
        if (isError(r)) toast(String(r).replace("ERROR: ", ""), true);
      });
      var msgBtn = W.document.createElement("button");
      msgBtn.textContent = "✉";
      msgBtn.title = "Message";
      msgBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var r = call("smsCompose", c.number, "");
        if (isError(r)) toast(String(r).replace("ERROR: ", ""), true);
      });
      go.appendChild(callBtn); go.appendChild(msgBtn);

      row.appendChild(av); row.appendChild(info); row.appendChild(go);
      el.appendChild(row);
    });
  }

  function renderPerm() {
    var el = W.document.getElementById("perm");
    if (!el) return;
    el.textContent = S.granted ? (S.all.length + " contacts") : "Denied";
    el.className = "chip " + (S.granted ? "ok" : "no");
  }

  function load() {
    var r = call("contactsList", LIMIT);
    if (r === null || isError(r)) {
      S.granted = false; S.all = []; S.view = [];
      renderPerm(); render();
      return [];
    }
    var arr = json(r);
    S.granted = true;
    S.all = Array.isArray(arr) ? arr : [];
    S.view = filter(S.all, S.query);
    renderPerm(); render();
    return S.all;
  }

  function search(q) {
    S.query = q || "";
    S.view = filter(S.all, S.query);
    render();
    return S.view;
  }

  function requestAccess() {
    var r = call("sysRequest", "android.permission.READ_CONTACTS,android.permission.WRITE_CONTACTS");
    if (r === null) { toast("Bridge unavailable", true); return false; }
    toast("Grant contacts access, then reload");
    return true;
  }

  function add(name, number, email) {
    if (!name || !String(name).trim()) { toast("Name required", true); return false; }
    var r = call("contactsAdd", name, number || "", email || "");
    if (r === null) { toast("Bridge unavailable", true); return false; }
    if (isError(r)) { toast(String(r).replace("ERROR: ", ""), true); return false; }
    toast("Contact added");
    load();
    return true;
  }

  function boot() {
    var q = W.document.getElementById("q");
    if (q) q.addEventListener("input", function (ev) { search(ev.target.value); });
    var perm = W.document.getElementById("perm");
    if (perm) perm.addEventListener("click", requestAccess);
    var addBtn = W.document.getElementById("add");
    if (addBtn) addBtn.addEventListener("click", function () {
      if (!W.prompt) return;
      var n = W.prompt("Name"); if (!n) return;
      var p = W.prompt("Phone number") || "";
      var e = W.prompt("Email (optional)") || "";
      add(n, p, e);
    });
    load();
    return S;
  }

  var API = {
    VERSION: VERSION, state: S, boot: boot, load: load, search: search,
    add: add, filter: filter, initials: initials, typeLabel: typeLabel,
    requestAccess: requestAccess, _render: render, _boot: boot
  };
  W.DarkithContacts = API;
  if (W.document && W.document.readyState !== "loading") boot();
  else if (W.document) W.document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
