<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050505">
<title>DARKITH Ω — files</title>
<style>
  :root{
    --bg:#050505; --panel:#0b0d10; --panel2:#12151a; --line:#1e232b;
    --ink:#e8ecf1; --dim:#8a93a0; --faint:#5b6572;
    --acc:#39d3a0; --acc2:#7aa2ff; --warn:#ffb454; --bad:#ff5f5f;
    --r:10px; --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}

  #app{display:flex;flex-direction:column;height:100%;max-width:1100px;margin:0 auto}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:8px;padding:10px 12px;
    border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0a0c0f,#070809)}
  #crumb{flex:1;min-width:0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  #crumb::-webkit-scrollbar{display:none}
  .crumb{white-space:nowrap;padding:6px 8px;border-radius:7px;color:var(--dim);font-size:13px}
  .crumb:hover{background:var(--panel2);color:var(--ink)}
  .crumb.last{color:var(--ink);font-weight:600}
  .sep{color:var(--faint);align-self:center;font-size:11px}
  .iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;
    border-radius:9px;color:var(--dim);font-size:17px}
  .iconbtn:hover{background:var(--panel2);color:var(--ink)}
  .iconbtn:active{transform:scale(.94)}

  /* ---------- toolbar ---------- */
  #tools{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);
    background:var(--panel);overflow-x:auto;scrollbar-width:none;align-items:center}
  #tools::-webkit-scrollbar{display:none}
  .tbtn{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:8px;
    background:var(--panel2);color:var(--dim);font-size:12.5px;white-space:nowrap;
    border:1px solid transparent}
  .tbtn:hover{color:var(--ink);border-color:var(--line)}
  .tbtn.on{background:rgba(57,211,160,.14);color:var(--acc);border-color:rgba(57,211,160,.35)}
  #search{flex:1;min-width:120px;background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:8px 11px;color:var(--ink);font-size:13px;outline:none}
  #search:focus{border-color:rgba(122,162,255,.5)}

  /* ---------- grant banner ---------- */
  #grant{display:none;gap:10px;align-items:center;padding:10px 12px;
    background:rgba(255,180,84,.09);border-bottom:1px solid rgba(255,180,84,.28);
    color:var(--warn);font-size:12.5px}
  #grant.show{display:flex}
  #grant button{margin-left:auto;background:var(--warn);color:#1a1200;font-weight:700;
    padding:7px 12px;border-radius:7px;white-space:nowrap}

  /* ---------- list ---------- */
  #scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px}
  #list{display:flex;flex-direction:column}
  .row{display:flex;align-items:center;gap:11px;padding:10px 14px;
    border-bottom:1px solid rgba(30,35,43,.55);min-height:52px}
  .row:active{background:var(--panel2)}
  .row.sel{background:rgba(122,162,255,.13);box-shadow:inset 3px 0 0 var(--acc2)}
  .row.cut{opacity:.45}
  .ico{width:26px;text-align:center;font-size:16px;flex:none;filter:grayscale(.15)}
  .ico.dir{color:var(--acc2)}
  .ico.img{color:var(--acc)}
  .ico.aud{color:#c98cff}
  .ico.vid{color:#ff9f6b}
  .ico.doc{color:#8fd6ff}
  .ico.bin{color:var(--faint)}
  .meta{flex:1;min-width:0}
  .nm{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{font-size:11.5px;color:var(--faint);margin-top:1px}
  .chk{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line);
    flex:none;display:none;place-items:center;font-size:12px}
  #list.mode-sel .chk{display:grid}
  .chk.on{background:var(--acc2);border-color:var(--acc2);color:#05080f;font-weight:800}

  /* ---------- empty / error ---------- */
  #state{display:none;padding:48px 24px;text-align:center;color:var(--dim)}
  #state.show{display:block}
  #state .big{font-size:30px;margin-bottom:10px;opacity:.5}
  #state .msg{font-size:13px;line-height:1.6}
  #state .msg code{color:var(--warn);font-family:ui-monospace,monospace;font-size:12px}

  /* ---------- action bar ---------- */
  #actions{position:fixed;left:0;right:0;bottom:0;display:none;gap:4px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:rgba(11,13,16,.97);border-top:1px solid var(--line);
    backdrop-filter:blur(12px);z-index:40}
  #actions.show{display:flex}
  .act{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 4px;border-radius:9px;color:var(--dim);font-size:10.5px}
  .act .g{font-size:16px}
  .act:hover{background:var(--panel2);color:var(--ink)}
  .act.danger:hover{color:var(--bad)}
  #selcount{margin-left:auto;align-self:center;padding:0 10px;font-size:11.5px;color:var(--acc2)}

  /* ---------- preview ---------- */
  #prev{position:fixed;inset:0;background:rgba(3,4,6,.82);z-index:60;
    display:none;flex-direction:column;backdrop-filter:blur(6px)}
  #prev.show{display:flex}
  #prev-head{display:flex;align-items:center;gap:10px;padding:12px 14px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  #prev-title{flex:1;min-width:0;font-size:13.5px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  #prev-body{flex:1;overflow:auto;padding:14px;display:grid;place-items:center}
  #prev-body pre{margin:0;width:100%;height:100%;white-space:pre-wrap;word-break:break-word;
    font:12px/1.6 ui-monospace,monospace;color:var(--ink)}
  #prev-body img,#prev-body video{max-width:100%;max-height:100%;border-radius:var(--r)}
  #prev-body audio{width:min(100%,420px)}
  .pinfo{text-align:center;color:var(--dim);font-size:13px;line-height:1.9}
  .pinfo .k{color:var(--faint)}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,14px);
    background:#161a20;border:1px solid var(--line);color:var(--ink);
    padding:10px 16px;border-radius:10px;font-size:12.5px;z-index:80;
    opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
    max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,95,95,.5);color:#ffd9d9}

  @media(min-width:720px){ .nm{font-size:14px} .row{min-height:46px} }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="iconbtn" id="up" title="Up one level" aria-label="Up one level">↑</button>
    <div id="crumb"></div>
    <button class="iconbtn" id="roots" title="Places" aria-label="Places">⌂</button>
    <button class="iconbtn" id="more" title="Select" aria-label="Select">☰</button>
  </header>

  <div id="grant">
    <span>Storage access is not granted — Darkith can only see its own folder.</span>
    <button id="grantbtn">Grant</button>
  </div>

  <div id="tools">
    <button class="tbtn" id="newdir">＋ Folder</button>
    <button class="tbtn" id="sortby" title="Sort">⇅ Name</button>
    <button class="tbtn" id="density" title="Density">≡</button>
    <input id="search" placeholder="Filter this folder…" autocomplete="off" spellcheck="false">
  </div>

  <div id="scroll">
    <div id="list" role="list"></div>
    <div id="state"><div class="big">◌</div><div class="msg" id="statemsg"></div></div>
  </div>
</div>

<div id="actions">
  <button class="act" data-op="copy"><span class="g">⧉</span>Copy</button>
  <button class="act" data-op="cut"><span class="g">✂</span>Cut</button>
  <button class="act" data-op="rename"><span class="g">✎</span>Rename</button>
  <button class="act" data-op="delete" class="danger"><span class="g">🗑</span>Delete</button>
  <span id="selcount"></span>
</div>

<div id="prev">
  <div id="prev-head">
    <div id="prev-title"></div>
    <button class="iconbtn" id="prev-close" aria-label="Close">✕</button>
  </div>
  <div id="prev-body"></div>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";
  var W = typeof window !== "undefined" ? window : globalThis;
  var B = W.darkith || W.darkithNative || null;

  var VERSION = "1.0.0";
  var ROOT_FALLBACK = "/sdcard";

  var S = {
    cwd: ROOT_FALLBACK,
    roots: [],
    entries: [],
    filter: "",
    sortBy: "name",     // name | size | mtime | type
    sortDir: 1,         // 1 asc, -1 desc
    dense: false,
    selMode: false,
    sel: {},            // name -> true
    clip: null,         // {op:"copy"|"cut", paths:[], names:[]}
    grant: true,
    loading: false
  };

  /* ------------------------------------------------------------ bridge */
  function has(fn) { return !!(B && typeof B[fn] === "function"); }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    if (!has(fn)) return null;
    try { return B[fn].apply(B, args); } catch (e) { return null; }
  }

  /** Parse a bridge reply that should be JSON; returns null when it is an ERROR string. */
  function json(reply) {
    if (reply === null || reply === undefined) return null;
    if (typeof reply === "object") return reply;
    var s = String(reply).trim();
    if (!s || s.indexOf("ERROR") === 0) return null;
    try { return JSON.parse(s); } catch (e) { return null; }
  }

  function isError(reply) {
    return typeof reply === "string" && reply.indexOf("ERROR") === 0;
  }

  /**
   * Two bridges answer fileList differently:
   *   DarkithBridge     -> [{name, dir:Boolean, size}]
   *   HomekeeperBridge  -> [{name, type:"dir"|"file", bytes, mtime}]
   * Normalise to one shape so the UI never cares which host it runs under.
   */
  function normEntry(raw) {
    if (!raw || typeof raw !== "object") return null;
    var name = raw.name != null ? String(raw.name) : "";
    if (!name) return null;
    var dir = raw.dir === true || raw.type === "dir" || raw.isDir === true;
    var size = 0;
    if (typeof raw.bytes === "number") size = raw.bytes;
    else if (typeof raw.size === "number") size = raw.size;
    var mtime = typeof raw.mtime === "number" ? raw.mtime : 0;
    return { name: name, dir: dir, size: dir ? 0 : size, mtime: mtime };
  }

  function normList(reply) {
    var arr = json(reply);
    if (!arr) return null;
    if (!Array.isArray(arr)) return null;
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var e = normEntry(arr[i]);
      if (e) out.push(e);
    }
    return out;
  }

  /**
   * DarkithBridge.fileRoots() joins with U+0001; some hosts return a JSON array.
   * Absent entirely on HomekeeperBridge, where /sdcard is the documented home (SPI-8).
   */
  function parseRoots(reply) {
    var out = [];
    if (typeof reply === "string" && reply.length) {
      if (reply.charAt(0) === "[") {
        var arr = json(reply);
        if (Array.isArray(arr)) arr.forEach(function (r) { if (r) out.push(String(r)); });
      } else {
        reply.split("\u0001").forEach(function (r) { if (r) out.push(r); });
      }
    }
    if (!out.length) out.push(ROOT_FALLBACK);
    var seen = {};
    return out.filter(function (r) { return seen[r] ? false : (seen[r] = true); });
  }

  /* ------------------------------------------------------------- format */
  function fmtBytes(n) {
    if (typeof n !== "number" || isNaN(n) || n < 0) return "—";
    if (n < 1024) return n + " B";
    var u = ["KB", "MB", "GB", "TB"], v = n, i = -1;
    do { v /= 1024; i++; } while (v >= 1024 && i < u.length - 1);
    return (v >= 10 ? v.toFixed(0) : v.toFixed(1)) + " " + u[i];
  }

  function fmtTime(ms) {
    if (!ms) return "";
    var d = new Date(ms);
    if (isNaN(d.getTime())) return "";
    var now = new Date();
    var same = d.getFullYear() === now.getFullYear() &&
               d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    var hh = ("0" + d.getHours()).slice(-2), mm = ("0" + d.getMinutes()).slice(-2);
    if (same) return hh + ":" + mm;
    var mo = ("0" + (d.getMonth() + 1)).slice(-2), dd = ("0" + d.getDate()).slice(-2);
    return d.getFullYear() + "-" + mo + "-" + dd + " " + hh + ":" + mm;
  }

  function ext(name) {
    var i = name.lastIndexOf(".");
    return i > 0 ? name.slice(i + 1).toLowerCase() : "";
  }

  var KIND = {
    img: ["png","jpg","jpeg","gif","webp","bmp","svg","avif","heic"],
    aud: ["mp3","m4a","aac","ogg","opus","flac","wav","wma"],
    vid: ["mp4","mkv","webm","mov","avi","3gp","m4v"],
    doc: ["txt","md","json","js","css","html","htm","xml","kt","java","py","sh","csv","log","yml","yaml","toml","ini","c","h","cpp","rs","go"]
  };

  function kindOf(e) {
    if (e.dir) return "dir";
    var x = ext(e.name);
    for (var k in KIND) if (KIND[k].indexOf(x) >= 0) return k;
    return "bin";
  }

  var GLYPH = { dir: "▸", img: "▣", aud: "♪", vid: "▶", doc: "≡", bin: "◈" };

  /* --------------------------------------------------------------- paths */
  function join(dir, name) {
    if (dir.charAt(dir.length - 1) === "/") return dir + name;
    return dir + "/" + name;
  }

  function parentOf(p) {
    if (!p || p === "/") return "/";
    var t = p.replace(/\/+$/, "");
    var i = t.lastIndexOf("/");
    if (i <= 0) return "/";
    return t.slice(0, i);
  }

  function baseName(p) {
    if (!p) return "";
    var t = p.replace(/\/+$/, "");
    var i = t.lastIndexOf("/");
    return i < 0 ? t : t.slice(i + 1);
  }

  function crumbs(p) {
    var parts = String(p || "/").split("/").filter(function (s) { return s !== ""; });
    var out = [], acc = "";
    if (!parts.length) return [{ label: "/", path: "/" }];
    for (var i = 0; i < parts.length; i++) {
      acc += "/" + parts[i];
      out.push({ label: parts[i], path: acc });
    }
    return out;
  }

  /* --------------------------------------------------------------- sort */
  function sortEntries(list) {
    var by = S.sortBy, dir = S.sortDir;
    var copy = list.slice();
    copy.sort(function (a, b) {
      if (a.dir !== b.dir) return a.dir ? -1 : 1;   // folders always lead
      var r = 0;
      if (by === "size") r = a.size - b.size;
      else if (by === "mtime") r = a.mtime - b.mtime;
      else if (by === "type") r = (ext(a.name) || "").localeCompare(ext(b.name) || "");
      if (r === 0) r = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
      return r * dir;
    });
    return copy;
  }

  function applyFilter(list) {
    var q = S.filter.trim().toLowerCase();
    if (!q) return list;
    return list.filter(function (e) { return e.name.toLowerCase().indexOf(q) >= 0; });
  }

  /* ---------------------------------------------------------------- view */
  var $ = function (id) { return W.document ? W.document.getElementById(id) : null; };

  function toast(msg, bad) {
    var t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = bad ? "bad" : ""; }, 2200);
  }

  function renderCrumb() {
    var el = $("crumb");
    if (!el) return;
    el.textContent = "";
    var parts = crumbs(S.cwd);
    parts.forEach(function (p, i) {
      if (i) {
        var s = W.document.createElement("span");
        s.className = "sep"; s.textContent = "›";
        el.appendChild(s);
      }
      var b = W.document.createElement("button");
      b.className = "crumb" + (i === parts.length - 1 ? " last" : "");
      b.textContent = p.label;
      b.addEventListener("click", function () { go(p.path); });
      el.appendChild(b);
    });
    el.scrollLeft = el.scrollWidth;
  }

  function renderList() {
    var list = $("list"), state = $("state"), msg = $("statemsg");
    if (!list) return;
    var view = sortEntries(applyFilter(S.entries));

    list.textContent = "";
    list.className = S.selMode ? "mode-sel" : "";

    if (!view.length) {
      if (state) {
        state.className = "show";
        if (msg) {
          msg.textContent = S.entries.length
            ? "Nothing matches “" + S.filter + "”."
            : (S.cwd === "/" ? "This folder is empty." : "This folder is empty.");
        }
      }
    } else if (state) {
      state.className = "";
    }

    var frag = W.document.createDocumentFragment();
    view.forEach(function (e) {
      var kind = kindOf(e);
      var row = W.document.createElement("div");
      row.className = "row" + (S.sel[e.name] ? " sel" : "") +
        (S.clip && S.clip.op === "cut" && S.clip.names.indexOf(e.name) >= 0 ? " cut" : "");
      row.setAttribute("role", "listitem");
      row.dataset.name = e.name;

      var chk = W.document.createElement("span");
      chk.className = "chk" + (S.sel[e.name] ? " on" : "");
      chk.textContent = S.sel[e.name] ? "✓" : "";

      var ico = W.document.createElement("span");
      ico.className = "ico " + kind;
      ico.textContent = GLYPH[kind] || "◈";

      var meta = W.document.createElement("div");
      meta.className = "meta";
      var nm = W.document.createElement("div");
      nm.className = "nm";
      nm.textContent = e.name;                 // textContent: never inject a hostile name
      var sub = W.document.createElement("div");
      sub.className = "sub mono";
      sub.textContent = (e.dir ? "folder" : fmtBytes(e.size)) +
        (e.mtime ? " · " + fmtTime(e.mtime) : "");
      meta.appendChild(nm);
      meta.appendChild(sub);

      row.appendChild(chk);
      row.appendChild(ico);
      row.appendChild(meta);

      row.addEventListener("click", function () { onRowTap(e, row); });
      row.addEventListener("contextmenu", function (ev) {
        ev.preventDefault(); enterSelMode(); toggleSel(e.name);
      });
      frag.appendChild(row);
    });
    list.appendChild(frag);

    if (S.selMode) {
      var n = Object.keys(S.sel).length;
      var sc = $("selcount");
      if (sc) sc.textContent = n + " selected";
    }
  }

  function render() { renderCrumb(); renderList(); }

  /* ------------------------------------------------------------ selection */
  function enterSelMode() {
    S.selMode = true;
    var a = $("actions"); if (a) a.className = "show";
    renderList();
  }

  function exitSelMode() {
    S.selMode = false; S.sel = {};
    var a = $("actions"); if (a) a.className = "";
    renderList();
  }

  function toggleSel(name) {
    if (S.sel[name]) delete S.sel[name]; else S.sel[name] = true;
    if (!Object.keys(S.sel).length) exitSelMode(); else renderList();
  }

  function selectedNames() { return Object.keys(S.sel); }

  function selectedPaths() {
    return selectedNames().map(function (n) { return join(S.cwd, n); });
  }

  /* ------------------------------------------------------------ navigation */
  function go(path) {
    if (!path) return;
    S.loading = true;
    var reply = call("fileList", path);
    var list = normList(reply);

    if (list === null) {
      S.loading = false;
      if (isError(reply)) {
        toast(String(reply).replace("ERROR: ", ""), true);
        return false;
      }
      S.entries = [];
      S.cwd = path;
      render();
      toast("Cannot read this folder", true);
      return false;
    }

    S.cwd = path;
    S.entries = list;
    S.filter = "";
    var se = $("search"); if (se) se.value = "";
    S.sel = {}; S.selMode = false;
    var a = $("actions"); if (a) a.className = "";
    S.loading = false;
    render();
    return true;
  }

  function refresh() { return go(S.cwd); }

  function up() {
    var p = parentOf(S.cwd);
    if (p === S.cwd) { toast("Already at the top"); return false; }
    return go(p);
  }

  /* ------------------------------------------------------------- actions */
  function onRowTap(e, row) {
    if (S.selMode) { toggleSel(e.name); return; }
    if (e.dir) { go(join(S.cwd, e.name)); return; }
    preview(e);
  }

  function newFolder() {
    var name = W.prompt ? W.prompt("New folder name") : null;
    if (!name) return false;
    var clean = String(name).replace(/[\/\\]/g, "_").trim();
    if (!clean) { toast("Empty name", true); return false; }
    var reply = call("fileDirs", join(S.cwd, clean));
    if (isError(reply)) { toast(String(reply).replace("ERROR: ", ""), true); return false; }
    toast("Created " + clean);
    refresh();
    return true;
  }

  function rename(names) {
    if (!names || names.length !== 1) { toast("Select one item to rename"); return false; }
    var old = names[0];
    var name = W.prompt ? W.prompt("Rename to", old) : null;
    if (!name || name === old) return false;
    var clean = String(name).replace(/[\/\\]/g, "_").trim();
    if (!clean) { toast("Empty name", true); return false; }
    var reply = call("fileMove", join(S.cwd, old), join(S.cwd, clean));
    if (isError(reply)) { toast(String(reply).replace("ERROR: ", ""), true); return false; }
    toast("Renamed");
    exitSelMode(); refresh();
    return true;
  }

  function doDelete(names) {
    if (!names || !names.length) return false;
    if (W.confirm && !W.confirm("Delete " + names.length + " item(s)? This cannot be undone.")) return false;
    var failed = 0;
    names.forEach(function (n) {
      var reply = call("fileDelete", join(S.cwd, n));
      if (isError(reply)) failed++;
    });
    toast(failed ? failed + " failed" : "Deleted " + names.length, !!failed);
    exitSelMode(); refresh();
    return failed === 0;
  }

  function setClip(op, names) {
    if (!names || !names.length) { toast("Nothing selected"); return false; }
    S.clip = { op: op, names: names.slice(), paths: names.map(function (n) { return join(S.cwd, n); }) };
    toast((op === "cut" ? "Cut " : "Copied ") + names.length + " item(s)");
    exitSelMode();
    renderList();
    return true;
  }

  function paste() {
    if (!S.clip || !S.clip.paths.length) { toast("Clipboard is empty"); return false; }
    var op = S.clip.op, failed = 0;
    S.clip.paths.forEach(function (src) {
      var dst = join(S.cwd, baseName(src));
      if (dst === src) { toast("Same folder — skipped", true); return; }
      var reply = op === "cut" ? call("fileMove", src, dst) : call("fileCopy", src, dst);
      if (isError(reply)) failed++;
    });
    toast(failed ? failed + " failed" : (op === "cut" ? "Moved" : "Copied"), !!failed);
    if (!failed && op === "cut") S.clip = null;
    refresh();
    return failed === 0;
  }

  /* ------------------------------------------------------------- preview */
  function preview(e) {
    var path = join(S.cwd, e.name);
    var kind = kindOf(e);
    var box = $("prev"), title = $("prev-title"), body = $("prev-body");
    if (!box || !body) return false;

    title.textContent = e.name;
    body.textContent = "";
    box.className = "show";

    if (kind === "img") {
      var img = W.document.createElement("img");
      img.alt = e.name;
      img.src = "file://" + path;
      body.appendChild(img);
      return true;
    }
    if (kind === "vid") {
      var v = W.document.createElement("video");
      v.controls = true; v.src = "file://" + path;
      body.appendChild(v);
      return true;
    }
    if (kind === "aud") {
      var au = W.document.createElement("audio");
      au.controls = true; au.src = "file://" + path;
      body.appendChild(au);
      return true;
    }

    // Text-ish: fileRead refuses binaries with BINARY_REFUSAL by design.
    var reply = call("fileRead", path);
    if (isError(reply)) {
      var why = String(reply).replace("ERROR: ", "");
      var info = W.document.createElement("div");
      info.className = "pinfo";
      if (why.indexOf("BINARY_REFUSAL") >= 0) {
        info.innerHTML = "";
        info.appendChild(textNode("Binary file — not shown as text."));
        var br = W.document.createElement("br");
        info.appendChild(br);
        info.appendChild(textNode(fmtBytes(e.size) + " · " + (ext(e.name) || "no extension")));
      } else if (why.indexOf("too large") >= 0) {
        info.appendChild(textNode("Too large to preview (" + fmtBytes(e.size) + ")."));
      } else {
        info.appendChild(textNode(why));
      }
      body.appendChild(info);
      return false;
    }

    var pre = W.document.createElement("pre");
    pre.textContent = String(reply);
    body.appendChild(pre);
    return true;
  }

  function textNode(s) { return W.document.createTextNode(s); }

  /* --------------------------------------------------------------- boot */
  function boot() {
    // Storage grant: absent bridge method means "assume granted" (desktop/preview).
    if (has("storageGranted")) {
      var g = call("storageGranted");
      S.grant = g === true || String(g) === "true";
    }
    var gb = $("grant");
    if (gb) gb.className = S.grant ? "" : "show";

    S.roots = parseRoots(has("fileRoots") ? call("fileRoots") : null);

    var start = S.roots[0] || ROOT_FALLBACK;
    if (!go(start)) go(ROOT_FALLBACK);

    wire();
    return S;
  }

  function wire() {
    var on = function (id, fn) {
      var el = $(id);
      if (el) el.addEventListener("click", fn);
    };
    on("up", up);
    on("newdir", newFolder);
    on("more", function () { S.selMode ? exitSelMode() : enterSelMode(); });
    on("roots", function () {
      var next = S.roots[(S.roots.indexOf(S.cwd) + 1) % S.roots.length] || S.roots[0];
      if (next) go(next);
    });
    on("grantbtn", function () { call("requestStorage"); toast("Grant access, then reopen Darkith"); });
    on("sortby", function () {
      var order = ["name", "size", "mtime", "type"];
      var i = order.indexOf(S.sortBy);
      if (S.sortDir === 1 && i === order.length - 1) { S.sortDir = -1; }
      else if (S.sortDir === -1) { S.sortDir = 1; S.sortBy = order[(i + 1) % order.length]; }
      else { S.sortBy = order[(i + 1) % order.length]; }
      var el = $("sortby");
      if (el) el.textContent = "⇅ " + S.sortBy.charAt(0).toUpperCase() + S.sortBy.slice(1) +
        (S.sortDir < 0 ? " ↓" : " ↑");
      renderList();
    });
    on("density", function () {
      S.dense = !S.dense;
      var el = $("density");
      if (el) el.className = "tbtn" + (S.dense ? " on" : "");
      renderList();
    });
    on("prev-close", function () { var p = $("prev"); if (p) p.className = ""; });

    var se = $("search");
    if (se) se.addEventListener("input", function () { S.filter = se.value; renderList(); });

    if (W.document) {
      W.document.querySelectorAll("#actions .act").forEach(function (b) {
        b.addEventListener("click", function () {
          var op = b.dataset.op, names = selectedNames();
          if (op === "copy") setClip("copy", names);
          else if (op === "cut") setClip("cut", names);
          else if (op === "rename") rename(names);
          else if (op === "delete") doDelete(names);
        });
      });

      W.document.addEventListener("keydown", function (ev) {
        var tag = (ev.target && ev.target.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") {
          if (ev.key === "Escape" && ev.target) { ev.target.value = ""; S.filter = ""; renderList(); }
          return;
        }
        if (ev.key === "Backspace") { ev.preventDefault(); up(); }
        else if (ev.key === "Escape") { exitSelMode(); var p = $("prev"); if (p) p.className = ""; }
        else if (ev.key === "/") { ev.preventDefault(); var s = $("search"); if (s) s.focus(); }
        else if (ev.key === "n") { newFolder(); }
        else if (ev.key === "r") { refresh(); }
        else if (ev.key === "v" && S.clip) { paste(); }
      });
    }
  }

  /* --------------------------------------------------------------- API */
  var API = {
    VERSION: VERSION,
    state: S,
    boot: boot,
    go: go,
    refresh: refresh,
    up: up,
    join: join,
    parentOf: parentOf,
    baseName: baseName,
    crumbs: crumbs,
    normEntry: normEntry,
    normList: normList,
    parseRoots: parseRoots,
    sortEntries: sortEntries,
    applyFilter: applyFilter,
    fmtBytes: fmtBytes,
    fmtTime: fmtTime,
    kindOf: kindOf,
    ext: ext,
    selectedNames: selectedNames,
    selectedPaths: selectedPaths,
    setClip: setClip,
    paste: paste,
    doDelete: doDelete,
    rename: rename,
    newFolder: newFolder,
    preview: preview,
    isError: isError,
    _render: render,
    _boot: boot
  };

  W.DarkithFiles = API;
  if (W.document && W.document.readyState !== "loading") boot();
  else if (W.document) W.document.addEventListener("DOMContentLoaded", boot);
})();
</script>
</body>
</html>
