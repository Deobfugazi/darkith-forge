const byCluster = { law: [], suite: [], class: [], gen: [], tool: [] };

    const na = byId[e.a], nb = byId[e.b];
    const alive = birthOf(na) <= currentFrame() && birthOf(nb) <= currentFrame();
    const hot = hover === na || hover === nb || selected === na || selected === nb;
    ctx.beginPath();
    const bend = Math.hypot(B.x - A.x, B.y - A.y) * 0.22;
    ctx.moveTo(A.x + 70, A.y);
    ctx.bezierCurveTo(A.x + 70 + bend, A.y, B.x - 70 - bend, B.y, B.x - 70, B.y);
    ctx.strokeStyle = (TYPE_COLOR[na.type] || "#39516c") + (alive ? (hot ? "cc" : "55") : "14");
    ctx.lineWidth = hot ? 2.2 : 1;
    ctx.setLineDash([6, 7]); ctx.lineDashOffset = -flowT * (e.kind === "gates" ? 2 : 1) * 12;
    ctx.stroke(); ctx.setLineDash([]);
  }

  // nodes
  for (const n of nodes) {
    const p = POS[n.id]; if (!p) continue;
    const a = nodeAlpha(n), born = birthOf(n) <= currentFrame();
    const col = TYPE_COLOR[n.type] || "#8fa3ba";
    ctx.save(); ctx.globalAlpha = a;
    const w = 140, h = 30, x = p.x - w / 2 + 70, y = p.y;
    ctx.shadowColor = col; ctx.shadowBlur = born ? (hover === n || selected === n ? 22 : 8) : 0;
    ctx.fillStyle = "rgba(8,14,24,0.92)";
    rbox(x - 70, y - h / 2, w, h, 6); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = col + (selected === n ? "ff" : "88"); ctx.lineWidth = selected === n ? 2 : 1;
    rbox(x - 70, y - h / 2, w, h, 6); ctx.stroke();
    glyph(n.type, x - 58, y);
    ctx.fillStyle = col; ctx.font = "10px ui-monospace, monospace";
    ctx.textBaseline = "middle";
    ctx.fillText(trunc(n.name, 20), x - 46, y);
    ctx.restore();
  }

  // commit caption in space: the frame's subject floats above the newest born spine
  drawFrameTag(now / 1000);
  requestAnimationFrame(draw);
}

function trunc(s, n) { s = s == null ? "" : String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function rbox(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function glyph(t, x, y) { ctx.fillStyle = TYPE_COLOR[t]; ctx.beginPath();
  if (t === "law") { ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 5, y); }
  else if (t === "suite") { ctx.rect(x - 4.5, y - 4.5, 9, 9); }
  else if (t === "class") { ctx.arc(x, y, 5, 0, 7); }
  else if (t === "gen") { ctx.moveTo(x - 5, y - 5); ctx.lineTo(x + 5, y - 5); ctx.lineTo(x + 5, y + 5); ctx.lineTo(x - 5, y + 5); ctx.rect(x - 5, y - 5, 10, 10); }
  else { ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.rect(x - 6.5, y - 1.5, 13, 3); }
  ctx.fill(); ctx.beginPath(); }

function drawFrameTag(f) {
  const fr = currentFrame(), c = tl[fr]; if (!c) return;
  ctx.save();
  ctx.globalAlpha = 0.9; ctx.textAlign = "center";
  ctx.fillStyle = "#e8c67a"; ctx.font = "600 13px ui-monospace, monospace";
  ctx.fillText("◂ frame " + (fr + 1) + " / " + N + "  ▸", 0, -185);
  ctx.fillStyle = "#9fb3c8"; ctx.font = "11px ui-monospace, monospace";
  ctx.fillText(trunc(c.s, 90), 0, -165);
  ctx.restore(); ctx.textAlign = "start";
}

/* ---------- HUD bindings ---------- */
const $ = id => document.getElementById(id);
function fmtLoc(n) { return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n); }
function syncHud() {
  const fr = currentFrame(); const c = tl[fr] || { s: "", h: "", loc: 0, f: 0 };
  $("scrub").value = String(N > 1 ? frame / (N - 1) * 1000 : 0);
  $("msg").innerHTML = "<b>" + (fr + 1) + "/" + N + "</b> · " + c.h + " · " +
    trunc(c.s, 160) + " · +" + c.a + " −" + c.d + " · " + fmtLoc(c.loc) + " LOC";
  const bornCount = nodes.filter(n => birthOf(n) <= fr).length;
  $("meta").textContent = "head " + (MAP.head || "").slice(0, 8) +
    " · " + nodes.length + " nodes · " + edges.length + " edges · born " + bornCount +
    "/" + nodes.length;
}
function select(n) {
  selected = n;
  const box = $("info");
  if (!n) { box.hidden = true; return; }
  box.hidden = false;
  $("i-name").textContent = n.name;
  $("i-sub").textContent = n.sub || "";
  $("i-ref").textContent = n.file ? (n.file + (n.line ? ":" + n.line : "")) : "";
}
function pause() { playing = false; $("play").textContent = "▶ play"; $("play").classList.remove("on"); }
function play() { playing = true; $("play").textContent = "⏸ pause"; $("play").classList.add("on"); }
function toggle() { playing ? pause() : play(); }
$("play").onclick = toggle;
$("rev").onclick = () => { dir = -dir;
  $("rev").textContent = dir < 0 ? "⟲ rew" : "⟲ fwd"; $("rev").classList.toggle("on", dir < 0); };
$("loop").onclick = () => { loopAtEnd = !loopAtEnd; $("loop").classList.toggle("on", loopAtEnd); };
$("loop").classList.add("on");
$("slow").onclick = () => setSpeed(speedIx - 1);
$("fast").onclick = () => setSpeed(speedIx + 1);
$("scrub").oninput = e => { pause(); frame = (e.target.value / 1000) * (N - 1); syncHud(); };

/* ---------- navi-drone camera ---------- */
let drag = null;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY,
  cx: cam.tx, cy: cam.ty }; cv.classList.add("drag"); });
addEventListener("pointermove", e => {
  if (drag) { cam.tx = drag.cx + (e.clientX - drag.x) / cam.z; cam.ty = drag.cy + (e.clientY - drag.y) / cam.z; return; }
  onHover(e.clientX, e.clientY);
});
addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });
cv.addEventListener("wheel", e => { e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  const nz = Math.max(0.25, Math.min(6, cam.tz * k));
  if (follows) { cam.tz = nz; return; }
  const wx = (e.clientX - innerWidth / 2) / cam.z - cam.x;
  const wy = (e.clientY - innerHeight / 2) / cam.z - cam.y;
  cam.tx = wx - (e.clientX - innerWidth / 2) / nz;
  cam.ty = wy - (e.clientY - innerHeight / 2) / nz;
  cam.tz = nz;
}, { passive: false });
cv.addEventListener("dblclick", () => { if (hover) follows = hover.id; });
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.key === "ArrowRight") { pause(); frame = Math.min(N - 1, currentFrame() + (e.shiftKey ? 10 : 1)); syncHud(); }
  else if (e.key === "ArrowLeft") { pause(); frame = Math.max(0, currentFrame() - (e.shiftKey ? 10 : 1)); syncHud(); }
  else if (e.key === "+" || e.key === "=") setSpeed(speedIx + 1);
  else if (e.key === "-" || e.key === "_") setSpeed(speedIx - 1);
  else if (e.key === "l" || e.key === "L") $("loop").onclick();
  else if (e.key === "f" || e.key === "F") { follows = null; cam.tx = 0; cam.ty = 0; cam.tz = 1; }
  else if (e.key === "Escape") { follows = null; select(null); }
});

function screenToWorld(sx, sy) {
  return { x: (sx - innerWidth / 2) / cam.z - cam.x,
           y: (sy - innerHeight / 2) / cam.z - cam.y };
}
function onHover(sx, sy) {
  const w = screenToWorld(sx, sy);
  let best = null, bd = 26;
  for (const n of nodes) { const p = POS[n.id]; if (!p) continue;
    if (Math.abs(w.x - p.x) < 74 && Math.abs(w.y - p.y) < 18) {
      const d = Math.hypot(w.x - p.x, w.y - p.y); if (d < bd) { bd = d; best = n; } } }
  if (best !== hover) { hover = best; cv.style.cursor = best ? "pointer" : "grab"; }
  if (best && !selected) select(best); else if (!best) select(null);
}
cv.addEventListener("click", e => { if (hover) { select(hover); follows = hover.id; } });

/* ---------- dirs panel ---------- */
function drawDirs() {
  const el = $("dirs");
  const ds = (MAP.dirs || []).slice(0, 6);
  const max = Math.max(1, ...ds.map(d => d.bytes));
  el.innerHTML = "<div style='color:#9adcff;margin-bottom:4px'>tree mass — live derivation</div>" +
    ds.map(d => "<div>" + d.dir + " · " + d.files + " files · " + fmtLoc(d.bytes) + " B</div>" +
      "<div class='bar' style='width:" + Math.max(2, Math.round(d.bytes / max * 100)) + "%'></div>").join("");
}
drawDirs();

/* ---------- go ---------- */
if (MAP.schema !== 1) {
  document.body.innerHTML = "<div style='padding:40px;color:#ff9adf'>STALE OR EMPTY MAP — " +
    "regenerate: <code>python3 build/gen_holostream.py</code> (MUST #42: the map is derived, not drawn)</div>";
} else {
  setSpeed(2); play(); syncHud();
  requestAnimationFrame(draw);
}
})();
</script>
</body>
</html>
