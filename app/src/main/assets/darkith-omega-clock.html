<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050505">
<title>DARKITH Ω — clock</title>
<style>
  :root{--bg:#050505;--panel:#0b0d10;--panel2:#12151a;--line:#1e232b;--ink:#e8ecf1;
    --dim:#8a93a0;--faint:#5b6572;--acc:#39d3a0;--acc2:#7aa2ff;--bad:#ff5f5f;--warn:#ffb454}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  #app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
  #clock{text-align:center;padding:26px 12px 10px}
  #time{font:200 58px/1 ui-monospace,SFMono-Regular,monospace;letter-spacing:-1px;
    font-variant-numeric:tabular-nums}
  #date{font-size:12.5px;color:var(--dim);margin-top:7px;letter-spacing:.4px}
  #tabs{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .tab{flex:1;padding:9px;border-radius:9px;font-size:13px;color:var(--dim);
    background:var(--panel2);border:1px solid transparent}
  .tab.on{color:var(--acc);background:rgba(57,211,160,.13);border-color:rgba(57,211,160,.35)}
  #body{flex:1;overflow-y:auto;padding:14px 12px calc(18px + env(safe-area-inset-bottom))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .lbl{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.9px;margin-bottom:9px}
  .row{display:flex;gap:8px;align-items:center}
  input[type=number],input[type=text]{background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:11px;color:var(--ink);font-size:15px;outline:none;
    font-family:ui-monospace,monospace}
  input[type=number]{width:88px;text-align:center}
  input[type=text]{flex:1;min-width:0;font-family:inherit;font-size:13.5px}
  .btn{min-height:46px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);
    padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:13.5px}
  .btn.primary{background:var(--acc);color:#04120c;font-weight:800;border-color:var(--acc)}
  .btn.wide{flex:1}
  .btn:active{transform:scale(.98)}
  #big{font:200 44px/1 ui-monospace,monospace;text-align:center;padding:16px 0 8px;
    font-variant-numeric:tabular-nums;letter-spacing:-1px}
  #swbtns{display:flex;gap:8px}
  .lap{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(30,35,43,.6);
    font:13px/1.4 ui-monospace,monospace;color:var(--dim)}
  .lap .n{color:var(--faint)}
  #hint{font-size:11.5px;color:var(--faint);line-height:1.6;margin-top:8px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);background:#161a20;
    border:1px solid var(--line);padding:9px 15px;border-radius:9px;font-size:12.5px;opacity:0;
    transition:.16s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,95,95,.5);color:#ffd9d9}
</style>
</head>
<body>
<div id="app">
  <div id="clock">
    <div id="time">--:--</div>
    <div id="date"></div>
  </div>
  <div id="tabs">
    <button class="tab on" data-tab="alarm">Alarm</button>
    <button class="tab" data-tab="timer">Timer</button>
    <button class="tab" data-tab="stopwatch">Stopwatch</button>
  </div>
  <div id="body"></div>
</div>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var W = typeof window !== "undefined" ? window : globalThis;
  var B = W.darkith || W.darkithNative || null;
  var VERSION = "1.0.0";

  var S = {
    tab: "alarm",
    alarm: { hour: 7, minute: 0, label: "" },
    timer: { seconds: 300, label: "" },
    sw: { running: false, start: 0, elapsed: 0, laps: [] }
  };

  function has(fn) { return !!(B && typeof B[fn] === "function"); }
  function call() {
    var a = Array.prototype.slice.call(arguments), fn = a.shift();
    if (!has(fn)) return null;
    try { return B[fn].apply(B, a); } catch (e) { return null; }
  }
  function isError(r) { return typeof r === "string" && r.indexOf("ERROR") === 0; }

  function toast(msg, bad) {
    var t = W.document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = bad ? "bad" : ""; }, 2100);
  }

  function pad2(n) { return ("0" + n).slice(-2); }

  /** mm:ss or h:mm:ss, matching what a stopwatch should show. */
  function fmtDur(ms) {
    if (typeof ms !== "number" || isNaN(ms) || ms < 0) ms = 0;
    var total = Math.floor(ms / 1000);
    var h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    if (h > 0) return h + ":" + pad2(m) + ":" + pad2(s);
    return pad2(m) + ":" + pad2(s);
  }

  function clockTick() {
    var t = W.document.getElementById("time");
    var d = W.document.getElementById("date");
    var now = new Date();
    if (t) t.textContent = pad2(now.getHours()) + ":" + pad2(now.getMinutes());
    if (d) {
      d.textContent = now.toLocaleDateString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
      });
    }
  }

  /* ------------------------------------------------------------ alarm */
  function setAlarm() {
    var h = parseInt(S.alarm.hour, 10), m = parseInt(S.alarm.minute, 10);
    if (isNaN(h) || h < 0 || h > 23) { toast("Hour must be 0–23", true); return false; }
    if (isNaN(m) || m < 0 || m > 59) { toast("Minute must be 0–59", true); return false; }
    var r = call("clockSetAlarm", h, m, S.alarm.label || "Darkith", true);
    if (r === null) { toast("Alarm bridge unavailable", true); return false; }
    if (isError(r)) { toast(String(r).replace("ERROR: ", ""), true); return false; }
    toast("Alarm set for " + pad2(h) + ":" + pad2(m));
    return true;
  }

  function showAlarms() {
    var r = call("clockShowAlarms");
    if (r === null || isError(r)) { toast("Cannot open alarms", true); return false; }
    return true;
  }

  /* ------------------------------------------------------------ timer */
  function startTimer() {
    var secs = parseInt(S.timer.seconds, 10);
    if (isNaN(secs) || secs < 1 || secs > 86400) { toast("1–86400 seconds", true); return false; }
    var r = call("clockTimer", secs, S.timer.label || "Darkith");
    if (r === null) { toast("Timer bridge unavailable", true); return false; }
    if (isError(r)) { toast(String(r).replace("ERROR: ", ""), true); return false; }
    toast("Timer started: " + fmtDur(secs * 1000));
    return true;
  }

  /* -------------------------------------------------------- stopwatch */
  function swElapsed() {
    if (!S.sw.running) return S.sw.elapsed;
    return S.sw.elapsed + (Date.now() - S.sw.start);
  }

  function swToggle() {
    if (S.sw.running) {
      S.sw.elapsed = swElapsed();
      S.sw.running = false;
    } else {
      S.sw.start = Date.now();
      S.sw.running = true;
    }
    render();
    return S.sw.running;
  }

  function swLap() {
    if (!S.sw.running) { toast("Start the stopwatch first"); return false; }
    S.sw.laps.unshift(swElapsed());
    render();
    return S.sw.laps.length;
  }

  function swReset() {
    S.sw.running = false; S.sw.elapsed = 0; S.sw.laps = [];
    render();
    return true;
  }

  /* ------------------------------------------------------------ render */
  function render() {
    var body = W.document.getElementById("body");
    if (!body) return;
    body.textContent = "";

    if (S.tab === "alarm") {
      var c = card("Set alarm");
      var row = W.document.createElement("div");
      row.className = "row";
      row.appendChild(numInput(S.alarm.hour, 0, 23, function (v) { S.alarm.hour = v; }));
      row.appendChild(txt(":", "font-size:22px;color:var(--faint)"));
      row.appendChild(numInput(S.alarm.minute, 0, 59, function (v) { S.alarm.minute = v; }));
      row.appendChild(txtInput(S.alarm.label, "Label", function (v) { S.alarm.label = v; }));
      c.appendChild(row);

      var acts = W.document.createElement("div");
      acts.className = "row";
      acts.style.marginTop = "10px";
      acts.appendChild(btn("Set alarm", "primary wide", setAlarm));
      acts.appendChild(btn("Open alarms", "wide", showAlarms));
      c.appendChild(acts);
      c.appendChild(hint("Alarms are created by the system Clock app through AlarmClock. " +
        "Darkith does not run a background alarm service, so your alarm survives Darkith being closed."));
      body.appendChild(c);
    }

    if (S.tab === "timer") {
      var c2 = card("Timer");
      var r2 = W.document.createElement("div");
      r2.className = "row";
      r2.appendChild(numInput(S.timer.seconds, 1, 86400, function (v) { S.timer.seconds = v; }));
      r2.appendChild(txtInput(S.timer.label, "Label", function (v) { S.timer.label = v; }));
      c2.appendChild(r2);

      var pre = W.document.createElement("div");
      pre.className = "row";
      pre.style.marginTop = "8px";
      [60, 300, 600, 1800].forEach(function (s) {
        pre.appendChild(btn(fmtDur(s * 1000), "wide", function () {
          S.timer.seconds = s;
          render();
        }));
      });
      c2.appendChild(pre);

      var a2 = W.document.createElement("div");
      a2.className = "row";
      a2.style.marginTop = "10px";
      a2.appendChild(btn("Start timer", "primary wide", startTimer));
      c2.appendChild(a2);
      c2.appendChild(hint("The countdown is owned by the system Clock app (AlarmClock.ACTION_SET_TIMER), " +
        "so it keeps running with Darkith closed."));
      body.appendChild(c2);
    }

    if (S.tab === "stopwatch") {
      var c3 = card("Stopwatch");
      var big = W.document.createElement("div");
      big.id = "big";
      big.textContent = fmtDur(swElapsed());
      c3.appendChild(big);

      var row3 = W.document.createElement("div");
      row3.id = "swbtns";
      row3.appendChild(btn(S.sw.running ? "Pause" : "Start", "primary wide", swToggle));
      row3.appendChild(btn("Lap", "wide", swLap));
      row3.appendChild(btn("Reset", "wide", swReset));
      c3.appendChild(row3);
      body.appendChild(c3);

      if (S.sw.laps.length) {
        var c4 = card("Laps");
        S.sw.laps.forEach(function (ms, i) {
          var l = W.document.createElement("div");
          l.className = "lap";
          var n = W.document.createElement("span");
          n.className = "n"; n.textContent = "#" + (S.sw.laps.length - i);
          var v = W.document.createElement("span");
          v.textContent = fmtDur(ms);
          l.appendChild(n); l.appendChild(v);
          c4.appendChild(l);
        });
        body.appendChild(c4);
      }
      c3.appendChild(hint("The stopwatch is in-page: it runs while Darkith is open, " +
        "and is honest about that rather than pretending to be a system service."));
    }
  }

  function card(title) {
    var c = W.document.createElement("div");
    c.className = "card";
    var l = W.document.createElement("div");
    l.className = "lbl";
    l.textContent = title;
    c.appendChild(l);
    return c;
  }

  function hint(text) {
    var h = W.document.createElement("div");
    h.id = "hint";
    h.textContent = text;
    return h;
  }

  function numInput(val, min, max, onchange) {
    var i = W.document.createElement("input");
    i.type = "number"; i.value = String(val);
    i.min = String(min); i.max = String(max);
    i.addEventListener("input", function () { onchange(parseInt(i.value, 10)); });
    return i;
  }

  function txtInput(val, ph, onchange) {
    var i = W.document.createElement("input");
    i.type = "text"; i.value = val || ""; i.placeholder = ph || "";
    i.addEventListener("input", function () { onchange(i.value); });
    return i;
  }

  function txt(s, style) {
    var t = W.document.createElement("span");
    t.textContent = s;
    if (style) t.style.cssText = style;
    return t;
  }

  function btn(label, cls, fn) {
    var b = W.document.createElement("button");
    b.className = "btn " + (cls || "");
    b.textContent = label;
    b.addEventListener("click", fn);
    return b;
  }

  function selectTab(tab) {
    S.tab = tab;
    if (W.document) {
      W.document.querySelectorAll(".tab").forEach(function (b) {
        b.className = "tab" + (b.dataset && b.dataset.tab === tab ? " on" : "");
      });
    }
    render();
    return tab;
  }

  function boot() {
    clockTick();
    setInterval(clockTick, 1000);
    setInterval(function () {
      if (S.tab === "stopwatch" && S.sw.running) {
        var b = W.document.getElementById("big");
        if (b) b.textContent = fmtDur(swElapsed());
      }
    }, 100);

    if (W.document) {
      W.document.querySelectorAll(".tab").forEach(function (b) {
        b.addEventListener("click", function () { selectTab(b.dataset.tab); });
      });
    }
    render();
    return S;
  }

  var API = {
    VERSION: VERSION, state: S, boot: boot, render: render, selectTab: selectTab,
    setAlarm: setAlarm, startTimer: startTimer, swToggle: swToggle, swLap: swLap,
    swReset: swReset, fmtDur: fmtDur, pad2: pad2, swElapsed: swElapsed,
    _boot: boot
  };
  W.DarkithClock = API;
  if (W.document && W.document.readyState !== "loading") boot();
  else if (W.document) W.document.addEventListener("DOMContentLoaded", boot);
})();
</script>
