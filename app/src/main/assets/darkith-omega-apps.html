<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#050505">
<title>DARKITH Ω — apps</title>
<style>
  :root{--bg:#050505;--panel:#0b0d10;--panel2:#12151a;--line:#1e232b;--ink:#e8ecf1;
    --dim:#8a93a0;--faint:#5b6572;--acc:#39d3a0;--acc2:#7aa2ff;--bad:#ff5f5f;--warn:#ffb454}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
    font:14px/1.45 ui-sans-serif,system-ui,-apple-system,Roboto,sans-serif}
  button,a{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-decoration:none}
  #wrap{max-width:860px;margin:0 auto;padding:22px 16px calc(28px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
  h1{font-size:19px;font-weight:700;letter-spacing:.3px;margin:0}
  h1 .o{color:var(--acc)}
  #sub{font-size:11.5px;color:var(--faint);margin-bottom:20px;letter-spacing:.4px}
  #badge{font-size:10.5px;padding:3px 8px;border-radius:20px;background:var(--panel2);
    color:var(--dim);margin-left:auto;white-space:nowrap}
  #badge.ok{color:var(--acc);background:rgba(57,211,160,.12)}
  #badge.no{color:var(--warn);background:rgba(255,180,84,.12)}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
  .app{display:flex;flex-direction:column;gap:9px;padding:16px 14px;border-radius:14px;
    background:var(--panel);border:1px solid var(--line);min-height:112px;
    transition:transform .12s,border-color .12s}
  .app:hover{border-color:#2b333e;transform:translateY(-1px)}
  .app:active{transform:scale(.985)}
  .app .g{font-size:24px;line-height:1}
  .app .n{font-size:13.5px;font-weight:600}
  .app .d{font-size:11px;color:var(--faint);line-height:1.4}
  .app .t{font-size:9.5px;color:var(--faint);letter-spacing:.7px;text-transform:uppercase;
    margin-top:auto;padding-top:4px}
  .app.soon{opacity:.55}
  #foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11px;color:var(--faint);line-height:1.7}
  #toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);background:#161a20;
    border:1px solid var(--line);padding:9px 15px;border-radius:9px;font-size:12.5px;opacity:0;
    transition:.16s;pointer-events:none;z-index:50;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.bad{border-color:rgba(255,95,95,.5);color:#ffd9d9}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>DARKITH <span class="o">Ω</span></h1>
    <span id="badge">host</span>
  </header>
  <div id="sub">handcoded default apps · one surface · offline</div>
  <div id="grid"></div>
  <div id="foot" id="foot">
    Every app here is a single HTML file with no build step and no network. Where the
    device needs a permission, the app says so plainly instead of faking a result.
  </div>
</div>
<div id="toast"></div>
<script>
(function () {
  "use strict";
  var W = typeof window !== "undefined" ? window : globalThis;
  var B = W.darkith || W.darkithNative || null;
  var VERSION = "1.0.0";

  /* The registry is the ONE list. Adding an app means adding one row here. */
  var APPS = [
    { id: "files",    n: "Files",     g: "▤", d: "Browse, move, rename, preview", href: "darkith-omega-files.html",    tag: "ready" },
    { id: "player",   n: "Player",    g: "▶", d: "Audio + video, subtitles, queue", href: "darkith-omega-media-player.html", tag: "ready" },
    { id: "phone",    n: "Phone",     g: "✆", d: "Keypad, dial, call",            href: "darkith-omega-phone.html",    tag: "ready" },
    { id: "messages", n: "Messages",  g: "✉", d: "Inbox and compose",             href: "darkith-omega-messages.html", tag: "ready" },
    { id: "contacts", n: "Contacts",  g: "◍", d: "Search, call, message",         href: "darkith-omega-contacts.html", tag: "ready" },
    { id: "camera",   n: "Camera",    g: "◉", d: "Capture and gallery",           href: "darkith-omega-camera.html",   tag: "ready" },
    { id: "clock",    n: "Clock",     g: "◷", d: "Alarm, timer, stopwatch",       href: "darkith-omega-clock.html",    tag: "ready" }
  ];

  function has(fn) { return !!(B && typeof B[fn] === "function"); }
  function call() {
    var a = Array.prototype.slice.call(arguments), fn = a.shift();
    if (!has(fn)) return null;
    try { return B[fn].apply(B, a); } catch (e) { return null; }
  }

  function toast(msg, bad) {
    var t = W.document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = "show" + (bad ? " bad" : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = bad ? "bad" : ""; }, 2000);
  }

  function renderBadge() {
    var el = W.document.getElementById("badge");
    if (!el) return;
    if (!B) { el.textContent = "preview"; el.className = "badge"; return; }
    var v = has("version") ? call("version") : null;
    el.textContent = v ? "host " + v : "host";
    el.className = "badge ok";
  }

  /**
   * In the app the launcher is served from assets, so a plain relative link works.
   * In the host shell it may be embedded, so fall back to the bridge's file viewer.
   */
  function open(app) {
    var href = app.href;
    if (W.location && /^https?:/.test(String(W.location.protocol || ""))) {
      W.location.href = href;
      return true;
    }
    if (W.location) {
      W.location.href = href;
      return true;
    }
    var r = call("openExternal", href);
    if (r === null) { toast("Cannot open " + app.n, true); return false; }
    return true;
  }

  function render() {
    var grid = W.document.getElementById("grid");
    if (!grid) return;
    grid.textContent = "";

    APPS.forEach(function (app) {
      var card = W.document.createElement("button");
      card.className = "app" + (app.tag === "ready" ? "" : " soon");
      card.dataset.app = app.id;

      var g = W.document.createElement("div");
      g.className = "g";
      g.textContent = app.g;

      var n = W.document.createElement("div");
      n.className = "n";
      n.textContent = app.n;

      var d = W.document.createElement("div");
      d.className = "d";
      d.textContent = app.d;

      var t = W.document.createElement("div");
      t.className = "t";
      t.textContent = app.tag;

      card.appendChild(g); card.appendChild(n); card.appendChild(d); card.appendChild(t);
      card.addEventListener("click", function () { open(app); });
      grid.appendChild(card);
    });
  }

  function boot() {
    renderBadge();
    render();
    return APPS;
  }

  var API = {
    VERSION: VERSION,
    APPS: APPS,
    boot: boot,
    open: open,
    _render: render,
    _boot: boot
  };
  W.DarkithApps = API;
  if (W.document && W.document.readyState !== "loading") boot();
  else if (W.document) W.document.addEventListener("DOMContentLoaded", boot);
})();
</script>
